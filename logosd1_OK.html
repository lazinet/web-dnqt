<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đối tác và Nhà tài trợ</title>
  <style>
    /* Sponsor Prefix CSS */
    .sponsor-main-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 40px 20px;
      width: 100%;
    }
    
    .sponsor-section {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      padding: 40px 0;
    }
    
    .sponsor-header {
      text-align: center;
      margin-bottom: 40px;
    }
    
    .sponsor-title {
      font-size: 2rem;
      color: #19658F;
      margin-bottom: 15px;
      font-weight: 700;
      position: relative;
      display: inline-block;
    }
    
    .sponsor-title:after {
      content: '';
      position: absolute;
      bottom: -10px;
      left: 50%;
      transform: translateX(-50%);
      width: 80px;
      height: 3px;
      background: #F15E22;
    }
    
    .sponsor-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 25px;
      justify-items: center;
    }
    
    .sponsor-item {
      width: 100%;
      max-width: 180px;
      height: 120px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 15px;
      background: white;
      border-radius: 8px;
      box-shadow: 0 4px 12px #19658F;;
      transition: all 0.3s ease;
    }
    
    .sponsor-item:hover {
      transform: translateY(-5px);
      box-shadow: 0 6px 16px #F15E22;
    }
    
    .sponsor-img {
      max-width: 100%;
      max-height: 80px;
      width: auto;
      height: auto;
      object-fit: contain;
      /* filter: grayscale(5%);
      opacity: 0.7; */
      transition: all 0.3s ease;
    }
    
    .sponsor-item:hover .sponsor-img {
      filter: grayscale(0%);
      opacity: 1;
    }
    
    .sponsor-loading {
      grid-column: 1 / -1;
      text-align: center;
      padding: 40px 0;
    }
    
    .sponsor-spinner {
      display: inline-block;
      width: 40px;
      height: 40px;
      border: 4px solid rgba(25, 101, 143, 0.2);
      border-radius: 50%;
      border-top-color: #19658F;
      animation: sponsor-spin 1s linear infinite;
    }
    
    .sponsor-error {
      grid-column: 1 / -1;
      text-align: center;
      padding: 40px 0;
    }
    
    .sponsor-error-icon {
      width: 48px;
      height: 48px;
      margin-bottom: 20px;
      color: #F15E22;
    }
    
    .sponsor-retry-btn {
      margin-top: 20px;
      padding: 10px 25px;
      background-color: #19658F;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 500;
      transition: background 0.3s;
    }
    
    .sponsor-retry-btn:hover {
      background-color: #13496b;
    }
    
    @media (max-width: 992px) {
      .sponsor-grid {
        grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
        gap: 20px;
      }
    }
    
    @media (max-width: 768px) {
      .sponsor-grid {
        grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
        gap: 15px;
      }
      
      .sponsor-item {
        height: 100px;
        padding: 10px;
      }
    }
    
    @media (max-width: 576px) {
      .sponsor-title {
        font-size: 1.5rem;
      }
      
      .sponsor-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }
    
    @keyframes sponsor-spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="sponsor-main-container">
    <section class="sponsor-section">
      <div class="sponsor-header">
        <h2 class="sponsor-title">TỔ CHỨC & DOANH NGHIỆP KHỞI TẠO CẦU NỐI VÀ NHÀ TÀI TRỢ</h2>
      </div>
      
      <div class="sponsor-grid" id="sponsor-list">
        <div class="sponsor-loading">
          <div class="sponsor-spinner"></div>
          <p style="margin-top: 15px; color: #19658F;">Đang tải danh sách đối tác...</p>
        </div>
      </div>
    </section>
  </div>

  <script>
  (function() {
    // Cấu hình với prefix sponsor
    const SPONSOR_CONFIG = {
      apiUrl: 'https://script.google.com/macros/s/AKfycbwQ8jH7FF4FeVK9acTnB1zxDfP3QfTynvsb5yFwEpE-1xhqpUQt9kDlDE5vEMSUlmGjmw/exec',
      cacheKey: 'sponsor_data_v1',
      cacheExpiry: 24 * 60 * 60 * 1000,
      timeout: 8000,
      maxRetries: 2,
      retryDelay: 2000
    };
    
    // DOM elements với prefix
    const sponsorList = document.getElementById('sponsor-list');
    let sponsorController = null;
    let sponsorRetryCount = 0;
    
    // Khởi tạo
    sponsorInit();
    
    function sponsorInit() {
      const cachedData = sponsorGetCachedData();
      if (cachedData) {
        sponsorRenderClients(cachedData);
      } else {
        sponsorLoadClients();
      }
      
      const observer = new IntersectionObserver((entries) => {
        if (entries[0].isIntersecting) {
          sponsorLoadClients();
          observer.unobserve(sponsorList);
        }
      }, { threshold: 0.1 });
      
      observer.observe(sponsorList);
    }
    
    // Hàm chính để tải dữ liệu
    async function sponsorLoadClients() {
      try {
        if (sponsorController) sponsorController.abort();
        
        sponsorController = new AbortController();
        const timeoutId = setTimeout(() => {
          sponsorController.abort();
          throw new Error('Request timeout');
        }, SPONSOR_CONFIG.timeout);
        
        sponsorShowLoadingState();
        
        const response = await fetch(SPONSOR_CONFIG.apiUrl, {
          signal: sponsorController.signal,
          cache: 'default'
        });
        
        clearTimeout(timeoutId);
        
        if (!response.ok) throw new Error(`HTTP error: ${response.status}`);
        
        const clients = await response.json();
        
        sponsorCacheData(clients);
        sponsorRenderClients(clients);
        sponsorPreloadImages(clients);
        
      } catch (error) {
        console.error('Sponsor load error:', error);
        sponsorHandleLoadError(error);
      } finally {
        sponsorController = null;
      }
    }
    
    // Xử lý lỗi
    async function sponsorHandleLoadError(error) {
      if (sponsorRetryCount < SPONSOR_CONFIG.maxRetries) {
        sponsorRetryCount++;
        console.log(`Sponsor retrying (${sponsorRetryCount}/${SPONSOR_CONFIG.maxRetries})...`);
        await new Promise(resolve => setTimeout(resolve, SPONSOR_CONFIG.retryDelay));
        return sponsorLoadClients();
      }
      
      sponsorShowErrorState(
        error.name === 'AbortError' 
          ? 'Tải dữ liệu quá thời gian chờ' 
          : 'Không thể tải danh sách đối tác'
      );
      
      const cachedData = sponsorGetCachedData();
      if (cachedData) {
        sponsorRenderClients(cachedData);
      }
    }
    
    // Cache functions
    function sponsorGetCachedData() {
      try {
        const cached = localStorage.getItem(SPONSOR_CONFIG.cacheKey);
        if (!cached) return null;
        
        const { data, timestamp } = JSON.parse(cached);
        if (Date.now() - timestamp > SPONSOR_CONFIG.cacheExpiry) {
          localStorage.removeItem(SPONSOR_CONFIG.cacheKey);
          return null;
        }
        
        return data;
      } catch {
        return null;
      }
    }
    
    function sponsorCacheData(data) {
      localStorage.setItem(SPONSOR_CONFIG.cacheKey, JSON.stringify({
        data,
        timestamp: Date.now()
      }));
    }
    
    // Render functions
    function sponsorRenderClients(clients) {
      const fragment = document.createDocumentFragment();
      
      clients.forEach(client => {
        const item = document.createElement('div');
        item.className = 'sponsor-item';
        
        const link = document.createElement('a');
        link.href = client.website || '#';
        link.target = '_blank';
        link.rel = 'noopener noreferrer';
        link.title = client.name || 'Đối tác';
        
        const img = document.createElement('img');
        img.className = 'sponsor-img';
        img.src = 'data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIxNjAiIGhlaWdodD0iOTAiIHZpZXdCb3g9IjAgMCAxNjAgOTAiPjxyZWN0IHdpZHRoPSIxNjAiIGhlaWdodD0iOTAiIGZpbGw9IiNmNWY1ZjUiLz48dGV4dCB4PSI1MCUiIHk9IjUwJSIgZm9udC1mYW1pbHk9IkFyaWFsIiBmb250LXNpemU9IjE0IiBmaWxsPSIjY2NjIiB0ZXh0LWFuY2hvcj0ibWlkZGxlIiBkb21pbmFudC1iYXNlbGluZT0ibWlkZGxlIj5Mb2dvPC90ZXh0Pjwvc3ZnPg==';
        img.dataset.src = client.logo;
        img.alt = client.name || '';
        img.loading = 'lazy';
        img.decoding = 'async';
        
        link.appendChild(img);
        item.appendChild(link);
        fragment.appendChild(item);
      });
      
      sponsorList.innerHTML = '';
      sponsorList.appendChild(fragment);
      
      sponsorLazyLoadImages();
    }
    
    function sponsorLazyLoadImages() {
      const lazyImages = document.querySelectorAll('.sponsor-img[data-src]');
      const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            const img = entry.target;
            img.src = img.dataset.src;
            img.removeAttribute('data-src');
            observer.unobserve(img);
          }
        });
      }, { rootMargin: '100px' });
      
      lazyImages.forEach(img => observer.observe(img));
    }
    
    function sponsorPreloadImages(clients) {
      clients.forEach(client => {
        const img = new Image();
        img.src = client.logo;
      });
    }
    
    // UI states
    function sponsorShowLoadingState() {
      sponsorList.innerHTML = `
        <div class="sponsor-loading">
          <div class="sponsor-spinner"></div>
          <p style="margin-top: 15px; color: #19658F;">Đang tải danh sách đối tác...</p>
        </div>
      `;
    }
    
    function sponsorShowErrorState(message) {
      sponsorList.innerHTML = `
        <div class="sponsor-error">
          <svg class="sponsor-error-icon" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="2"/>
            <path d="M12 8v4m0 4h.01" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
          <p>${message}</p>
          <button class="sponsor-retry-btn" onclick="window.sponsorRetryLoad()">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" style="margin-right: 5px;">
              <path d="M23 4v6h-6M1 20v-6h6"></path>
              <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
            </svg>
            Thử lại
          </button>
        </div>
      `;
    }
    
    // Global retry function với prefix
    window.sponsorRetryLoad = function() {
      sponsorRetryCount = 0;
      sponsorLoadClients();
    };
  })();
  </script>
</body>
</html>
