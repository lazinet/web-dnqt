<script>
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzA-JLGggzQaC4AZJZlofKZsDyTMsb8PjUXyWFeaq5T-fz7UZ4ygR3nVWwrBR37AqLeSA/exec';
    const BASE_IMG_URL = 'assets/background/';
    const PLACEHOLDER_IMG = 'assets/background/IRI04777_w2048.webp';  // Tạo file nếu cần
    const GROUP_SIZE = 6;  // Mỗi slide 6 blog
    const AUTOPLAY_DELAY = 30000;  // 30 giây

    let allBlogs = [];  // Cache full data từ lần load đầu (cho single và slider)

    // Helper: Update meta tag động (cho OG và Twitter)
    function updateMetaTag(property, content, isName = false) {
        const selector = isName 
            ? `meta[name="${property}"]` 
            : `meta[property="${property}"]`;
        let meta = document.querySelector(selector);
        if (!meta) {
            meta = document.createElement('meta');
            if (isName) {
                meta.setAttribute('name', property);
            } else {
                meta.setAttribute('property', property);
            }
            document.head.appendChild(meta);
        }
        meta.setAttribute('content', content);
    }

    // Share links (cho single mode)
    function setupShareLinks() {
        const currentUrl = encodeURIComponent(window.location.href);
        const fb = document.getElementById('share-fb');
        const li = document.getElementById('share-li');
        const ig = document.getElementById('share-ig');
        const tw = document.getElementById('share-tw');
        if (fb) fb.href = `https://www.facebook.com/sharer/sharer.php?u=${currentUrl}`;
        if (li) li.href = `https://www.linkedin.com/sharing/share-offsite/?url=${currentUrl}`;
        if (ig) ig.href = `https://www.instagram.com/?url=${currentUrl}`;  // IG không hỗ trợ direct share tốt, chỉ mở app
        if (tw) tw.href = `https://twitter.com/intent/tweet?url=${currentUrl}&text=Check this out!`;
    }

    // Render single blog (đã cập nhật meta + breadcrumb)
    function renderSingleBlog(blog) {
        // === UPDATE META ĐỘNG CHO SHARE (OG + Twitter) ===
        document.title = `QTBC News - ${blog.Title}`;

        const description = blog.Title || 'Bài viết từ QTBC - CLB Doanh nhân Quảng Trị';

        const featuredImage = blog.images?.length > 0 
            ? `https://qtbc.vn/${BASE_IMG_URL}${blog.images[0]}`
            : 'https://qtbc.vn/assets/logos/logo_2026_W512.webp';

        updateMetaTag('og:title', blog.Title);
        updateMetaTag('og:description', description);
        updateMetaTag('og:image', featuredImage);
        updateMetaTag('og:url', `https://qtbc.vn/?blog_id=${blog.Blog_ID}`);

        updateMetaTag('twitter:title', blog.Title, true);
        updateMetaTag('twitter:description', description, true);
        updateMetaTag('twitter:image', featuredImage, true);

        // Đảm bảo twitter:card là large image
        if (!document.querySelector('meta[name="twitter:card"]')) {
            const cardMeta = document.createElement('meta');
            cardMeta.setAttribute('name', 'twitter:card');
            cardMeta.setAttribute('content', 'summary_large_image');
            document.head.appendChild(cardMeta);
        }

        // === THÊM BREADCRUMB (QTBC News › Home Page) TRÊN ẢNH FEATURED ===
        const breadcrumbHtml = `
            <div class="single-post-breadcrumb">
                <a href="index.html#contact" class="breadcrumb-link">Đăng tin</a>
                <span class="separator">›</span>
                <a href="index.html" class="breadcrumb-link">QTBC</a>
            </div>
        `;
        const postImageEl = document.getElementById('post-image');
        if (postImageEl) {
            postImageEl.insertAdjacentHTML('afterbegin', breadcrumbHtml);
        }

        // Compute images array if not provided (fallback for cache)
        if (!blog.images) {
            blog.images = [
                blog.Image_Sub_URL,
                blog.Im_URL_Add1,
                blog.Im_URL_Add2,
                blog.Im_URL_Add3,
                blog.Im_URL_Add4,
                blog.Im_URL_Add5,
                blog.Im_URL_Add6,
                blog.Im_URL_Add7,
                blog.Im_URL_Add8,
                blog.Im_URL_Add9
            ].filter(url => url && url.toString().trim() !== '');
        }

        // Phần còn lại của renderSingleBlog (giữ nguyên như code gốc của bạn)
        if (postImageEl && blog.images.length > 0) {
            const firstImgSrc = BASE_IMG_URL + blog.images[0];

            if (blog.images.length === 1) {
                postImageEl.innerHTML += `
                    <figure class="image-anime reveal">
                        <img src="${firstImgSrc}" alt="${blog.Title || 'Blog Image'}" loading="lazy" onerror="this.src='${PLACEHOLDER_IMG}'">
                    </figure>
                `;
                if (typeof gsap !== 'undefined') {
                    const revealContainer = postImageEl.querySelector('.reveal');
                    if (revealContainer) {
                        gsap.set(revealContainer, { xPercent: 0, autoAlpha: 1 });
                        const image = revealContainer.querySelector('img');
                        if (image) gsap.set(image, { xPercent: 0, scale: 1, autoAlpha: 1 });
                    }
                }
            } else {
                const slidesHtml = blog.images.map(imgSrc => {
                    const fullSrc = BASE_IMG_URL + imgSrc;
                    return `
                        <div class="swiper-slide">
                            <figure class="image-anime reveal">
                                <img src="${fullSrc}" alt="${blog.Title || 'Blog Image'}" loading="lazy" onerror="this.src='${PLACEHOLDER_IMG}'">
                            </figure>
                        </div>
                    `;
                }).join('');
                postImageEl.innerHTML += `
                    <div class="swiper image-slider" id="post-image-slider">
                        <div class="swiper-wrapper">${slidesHtml}</div>
                        <div class="swiper-button-next post-next"></div>
                        <div class="swiper-button-prev post-prev"></div>
                        <div class="swiper-pagination post-pagination"></div>
                    </div>
                `;
                if (typeof Swiper !== 'undefined') {
                    new Swiper('#post-image-slider', {
                        loop: true,
                        pagination: { el: '.post-pagination', clickable: true },
                        navigation: { nextEl: '.post-next', prevEl: '.post-prev' },
                        autoplay: { delay: 5000, disableOnInteraction: false },
                        speed: 1000,
                        spaceBetween: 0,
                        breakpoints: {
                            768: { slidesPerView: 1 },
                            1366: { slidesPerView: 1 }
                        }
                    });
                }
                setTimeout(() => {
                    if (typeof gsap !== 'undefined') {
                        postImageEl.querySelectorAll('.reveal').forEach(reveal => {
                            gsap.set(reveal, { xPercent: 0, autoAlpha: 1 });
                            const image = reveal.querySelector('img');
                            if (image) gsap.set(image, { xPercent: 0, scale: 1, autoAlpha: 1 });
                        });
                    }
                }, 200);
            }

            if (typeof ScrollTrigger !== 'undefined') {
                ScrollTrigger.refresh();
            }
        } else {
            postImageEl.innerHTML += `<figure><img src="${PLACEHOLDER_IMG}" alt="Placeholder"></figure>`;
        }

        // Content (giữ nguyên phần còn lại của bạn)
        let entryHtml = `
            <p class="post-byline wow fadeInUp" style="text-align: right;"><strong><em>${blog.Author || 'Lazinet Team'}</em></strong> — <a href="${blog.Location_URL || '#'}"><strong><em>${blog.Location || 'N/A'}</em></strong></a> — <strong><em>${new Date(blog.Date).toLocaleDateString('vi-VN')}</em></strong></p>
            <p class="wow fadeInUp">${blog['P1 (Intro)'] || ''}</p>
            <p class="wow fadeInUp" data-wow-delay="0.2s">${blog['P2 (Main)'] || ''}</p>
        `;

        if (blog.Quote) {
            entryHtml += `<blockquote class="wow fadeInUp" data-wow-delay="0.4s"><p>${blog.Quote}</p></blockquote>`;
        }

        entryHtml += `
            <p class="wow fadeInUp" data-wow-delay="0.6s">${blog['P3 (End)'] || ''}</p>
            <h2 class="wow fadeInUp" data-wow-delay="0.8s">${blog.H2 || ''}</h2>
            <p class="wow fadeInUp" data-wow-delay="1s">${blog.P4 || ''}</p>
        `;

        let listItems = [];
        for (let i = 1; i <= 6; i++) {
            const liKey = `Li${i}`;
            if (blog[liKey]) listItems.push(`<li>${blog[liKey]}</li>`);
        }
        if (listItems.length > 0) {
            entryHtml += `<ul class="wow fadeInUp" data-wow-delay="1.2s">${listItems.join('')}</ul>`;
        }

        entryHtml += `<p class="wow fadeInUp" data-wow-delay="1.4s">${blog.P5 || ''}</p>`;

        if (blog.External_Name && blog.External_Link) {
            entryHtml += `<p>Source: <a href="${blog.External_Link}" target="_blank">${blog.External_Name}</a></p>`;
        }

        if (blog.Notes) {
            entryHtml += `<p class="wow fadeInUp" data-wow-delay="1.6s"><em>${blog.Notes}</em></p>`;
        }

        const postEntryEl = document.getElementById('post-entry');
        if (postEntryEl) postEntryEl.innerHTML = entryHtml;

        // Tags
        let tagsHtml = '<span class="tag-links">Tags: ';
        let tags = [];
        for (let i = 1; i <= 3; i++) {
            const tagKey = `Tag${i}`;
            if (blog[tagKey]) tags.push(`<a href="#">${blog[tagKey]}</a>`);
        }
        if (tags.length > 0) {
            tagsHtml += tags.join(' ') + '</span>';
            const postTagsEl = document.getElementById('post-tags');
            if (postTagsEl) postTagsEl.innerHTML = tagsHtml;
        } else {
            const postTagsEl = document.getElementById('post-tags');
            if (postTagsEl) postTagsEl.innerHTML = '';
        }

        // Setup share
        setupShareLinks();

        // Re-init WOW
        new WOW().init();
        
        // Refresh GSAP toàn bộ sau WOW
        if (typeof ScrollTrigger !== 'undefined') {
            ScrollTrigger.refresh();
        }
    }

    // New: Render blog slider (groups of 6 per slide) - giữ nguyên code gốc của bạn
    function renderBlogSlider(blogs) {
        if (!blogs || !Array.isArray(blogs)) {
            console.error('Invalid blogs data:', blogs);
            const row = document.getElementById('blog-list');
            if (row) row.innerHTML = '<p>Error loading posts. Invalid data.</p>';
            return;
        }

        const row = document.getElementById('blog-list');
        if (row) row.innerHTML = '';

        const chunks = [];
        for (let i = 0; i < blogs.length; i += GROUP_SIZE) {
            chunks.push(blogs.slice(i, i + GROUP_SIZE));
        }

        const slidesHtml = chunks.map((chunk, chunkIndex) => {
            const chunkPostsHtml = chunk.map((blog, index) => {
                const delay = (index * 0.2) + 's';
                const dateStr = blog['Date'] ? new Date(blog['Date']).toLocaleDateString('vi-VN') : '';
                const locationStr = blog['Location'] || 'N/A';
                const introFull = blog['P1 (Intro)'] || '';

                const tooltipHtml = `
                    <div class="tooltip-header"><strong>${dateStr} - ${locationStr}</strong></div>
                    <div class="tooltip-body">${introFull}</div>
                `;

                const imgSubUrlList = blog.Image_Sub_URL || '';
                const imgSrcList = imgSubUrlList ? BASE_IMG_URL + imgSubUrlList : PLACEHOLDER_IMG;

                const postHtml = `
                    <div class="col-xl-4 col-md-6">
                        <div class="post-item wow fadeInUp" data-wow-delay="${delay}">
                            <div class="post-featured-image">
                                <a href="?blog_id=${blog.Blog_ID}" data-cursor-text="Xem" target="_blank">
                                    <figure class="image-anime">
                                        <img src="${imgSrcList}" alt="${blog.Title}">
                                        <div class="image-tooltip">${tooltipHtml}</div>
                                    </figure>
                                </a>
                            </div>
                            <div class="post-item-body">
                                <div class="post-item-content">
                                    <h2><a href="?blog_id=${blog.Blog_ID}" target="_blank">${blog.Title}</a></h2>
                                </div>
                                <div class="post-item-btn">
                                    <a href="?blog_id=${blog.Blog_ID}" class="readmore-btn" target="_blank">Xem thêm</a>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
                return postHtml;
            }).join('');
            return `
                <div class="swiper-slide">
                    <div class="row">${chunkPostsHtml}</div>
                </div>
            `;
        }).join('');

        row.innerHTML = `
            <div class="swiper blog-slider" id="blog-slider">
                <div class="swiper-wrapper">${slidesHtml}</div>
                <div class="swiper-button-next blog-next"></div>
                <div class="swiper-button-prev blog-prev"></div>
                <div class="swiper-pagination blog-pagination"></div>
            </div>
        `;

        if (typeof Swiper !== 'undefined' && slidesHtml) {
            new Swiper('#blog-slider', {
                slidesPerView: 1,
                spaceBetween: 0,
                loop: chunks.length > 1,
                autoplay: {
                    delay: AUTOPLAY_DELAY,
                    disableOnInteraction: false,
                },
                pagination: {
                    el: '.blog-pagination',
                    clickable: true,
                },
                navigation: {
                    nextEl: '.blog-next',
                    prevEl: '.blog-prev',
                },
                speed: 1000,
                breakpoints: {
                    768: { slidesPerView: 1 },
                    1366: { slidesPerView: 1 }
                }
            });
        }

        new WOW().init();

        if (typeof ScrollTrigger !== 'undefined') {
            ScrollTrigger.refresh();
        }
    }

    // Load full blogs and render slider
    function loadBlogSlider() {
        const url = new URL(window.location);
        if (url.searchParams.has('page') && !url.searchParams.has('blog_id')) {
            url.searchParams.delete('page');
            history.replaceState({}, '', url);
        }

        $.ajax({
            url: SCRIPT_URL + '?action=list&limit=999',
            dataType: 'jsonp',
            success: function(response) {
                allBlogs = response.blogs || response;
                renderBlogSlider(allBlogs);
            },
            error: function() {
                console.error('Error loading blog slider');
                const row = document.getElementById('blog-list');
                if (row) row.innerHTML = '<p>Error loading posts.</p>';
            }
        });
    }

    // Load single từ cache hoặc API
    function loadSingleBlog(blogId) {
        const cachedBlog = allBlogs.find(b => b.Blog_ID === blogId);
        if (cachedBlog && cachedBlog['P2 (Main)']) {
            renderSingleBlog(cachedBlog);
        } else {
            $.ajax({
                url: SCRIPT_URL + '?blog_id=' + blogId,
                dataType: 'jsonp',
                success: function(blog) {
                    if (blog.error) {
                        alert('Blog not found');
                        window.location.href = '?';
                        return;
                    }
                    renderSingleBlog(blog);
                },
                error: function() {
                    console.error('Error loading single blog');
                    alert('Error loading post');
                    window.location.href = '?';
                }
            });
        }
    }

    // Main init
    $(document).ready(function() {
        const urlParams = new URLSearchParams(window.location.search);
        const blogId = urlParams.get('blog_id');

        if (blogId) {
            const listContainer = document.getElementById('list-container');
            const singleContainer = document.getElementById('single-container');
            const backBtn = document.getElementById('back-to-list');
            if (listContainer) listContainer.style.display = 'none';
            if (singleContainer) singleContainer.style.display = 'block';
            if (backBtn) backBtn.style.display = 'block';
            
            setTimeout(() => {
                loadSingleBlog(blogId);
                if (typeof ScrollTrigger !== 'undefined') {
                    ScrollTrigger.refresh();
                }
                setTimeout(() => {
                    if (typeof ScrollTrigger !== 'undefined') {
                        ScrollTrigger.refresh();
                    }
                }, 500);
            }, 100);
        } else {
            const singleContainer = document.getElementById('single-container');
            const backBtn = document.getElementById('back-to-list');
            if (singleContainer) singleContainer.style.display = 'none';
            if (backBtn) backBtn.style.display = 'none';
            loadBlogSlider();
        }
    });
</script>
</body>
