<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Danh sách Doanh nghiệp - CLB Doanh nhân Quảng Trị Miền Nam</title>
  <style>
    /* Reset CSS */
    .bizvideo-container * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Arial', sans-serif;
    }
    
    /* Main container */
    .bizvideo-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
    }
    
    /* Header */
    .bizvideo-header {
      text-align: center;
      margin-bottom: 30px;
      padding-bottom: 20px;
      border-bottom: 3px solid #F15E22;
    }
    
    .bizvideo-header h1 {
      color: #19658F;
      font-size: 28px;
      margin-bottom: 10px;
    }
    
    /* Grid layout */
    .bizvideo-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 20px;
    }
    
    /* Company card */
    .bizvideo-card {
      background-color: white;
      border-radius: 8px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      overflow: hidden;
      transition: transform 0.3s ease;
      height: 100%;
      display: flex;
      flex-direction: column;
    }
    
    .bizvideo-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);
    }
    
    /* Card content */
    .bizvideo-card-content {
      padding: 20px;
      flex-grow: 1;
      display: flex;
      flex-direction: column;
    }
    
    .bizvideo-card h2 {
      color: #19658F;
      font-size: 18px;
      margin-bottom: 10px;
      line-height: 1.3;
      min-height: 46px; /* Đảm bảo chiều cao đồng đều */
      display: flex;
      align-items: center;
    }
    
    .bizvideo-card p {
      margin-bottom: 8px;
      color: #333;
      font-size: 14px;
      line-height: 1.4;
    }
    
    .bizvideo-card .bizvideo-position {
      font-weight: bold;
      color: #F15E22;
    }
    
    .bizvideo-card .bizvideo-industry {
      font-style: italic;
      color: #666;
    }
    
    /* Video link */
    .bizvideo-video-link {
      display: inline-block;
      margin-top: 15px;
      padding: 8px 15px;
      background-color: #19658F;
      color: white;
      text-decoration: none;
      border-radius: 4px;
      font-size: 14px;
      text-align: center;
      transition: background-color 0.3s;
    }
    
    .bizvideo-video-link:hover {
      background-color: #13496D;
    }
    
    /* Additional fields */
    .bizvideo-additional {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px dashed #ddd;
      font-size: 13px;
      color: #555;
    }
    
    /* Responsive */
    @media (max-width: 768px) {
      .bizvideo-grid {
        grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      }
      
      .bizvideo-header h1 {
        font-size: 24px;
      }
    }
  </style>
</head>
<body class="bizvideo-container">
  <div class="bizvideo-header">
    <h1>DANH SÁCH DOANH NGHIỆP THÀNH VIÊN</h1>
    <p>Câu lạc bộ Doanh nhân Quảng Trị Miền Nam</p>
  </div>
  
  <div class="bizvideo-grid" id="companyGrid">
    <!-- Dữ liệu sẽ được thêm bằng JavaScript -->
  </div>
  
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      // Lấy dữ liệu từ Google Apps Script
      const scriptUrl = 'https://script.google.com/macros/s/AKfycbzivw010fPhNr7stNXdM7Rn7EAhXFoITqppIER7ZqmQyPYFILoy5UmPKMk_ea8JA-sRUw/exec'; // Thay bằng URL triển khai của bạn
      
      fetch(scriptUrl)
        .then(response => response.json())
        .then(data => {
          const grid = document.getElementById('companyGrid');
          
          data.forEach(company => {
            const card = document.createElement('div');
            card.className = 'bizvideo-card';
            
            let html = `
              <div class="bizvideo-card-content">
                <h2>${company['Tên doanh nghiệp (đầy đủ)'] || ''}</h2>
                <p class="bizvideo-position">${company['Chức vụ'] || ''}</p>
                <p><strong>${company['Họ và tên (có dấu)'] || ''}</strong></p>
                <p class="bizvideo-industry">${company['Tên lĩnh vực chuẩn hóa'] || ''}</p>
            `;
            
            // Thêm các trường bổ sung nếu có
            const additionalFields = [];
            for (let i = 1; i <= 3; i++) {
              const field = company[`Trường bổ sung ${i}`];
              if (field) {
                additionalFields.push(`<p>${field}</p>`);
              }
            }
            
            if (additionalFields.length > 0) {
              html += `<div class="bizvideo-additional">${additionalFields.join('')}</div>`;
            }
            
            // Thêm link video nếu có
            if (company['URL Video']) {
              html += `
                <a href="${company['URL Video']}" target="_blank" class="bizvideo-video-link">
                  Xem video giới thiệu
                </a>
              `;
            }
            
            html += `</div>`;
            card.innerHTML = html;
            grid.appendChild(card);
          });
        })
        .catch(error => {
          console.error('Error loading data:', error);
          document.getElementById('companyGrid').innerHTML = `
            <p style="grid-column: 1/-1; text-align: center; color: #F15E22;">
              Đang tải dữ liệu... Nếu thông báo này hiển thị quá lâu, vui lòng làm mới trang.
            </p>
          `;
        });
    });
  </script>
</body>
</html>
