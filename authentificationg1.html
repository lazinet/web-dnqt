<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CLB Doanh nhân Quảng Trị Miền Nam</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans">
  <div id="login-section" class="min-h-screen flex items-center justify-center bg-gradient-to-r from-[#19658F] to-[#F15E22]">
    <div class="bg-white p-8 rounded-lg shadow-lg w-full max-w-md">
      <img src="/assets/logos/Logo-bgWhite.png" alt="Logo CLB" class="mx-auto mb-6 h-20">
      <h2 class="text-2xl font-bold text-center text-[#19658F] mb-6">Đăng nhập</h2>
      <div id="error-message" class="hidden text-red-500 text-center mb-4"></div>
      <form id="login-form" class="space-y-4">
        <div>
          <label for="phone" class="block text-sm font-medium text-gray-700">Số điện thoại</label>
          <input type="text" id="phone" name="phone" required class="mt-1 p-2 w-full border rounded-md focus:ring-[#19658F] focus:border-[#19658F]">
        </div>
        <div>
          <label for="email" class="block text-sm font-medium text-gray-700">Email</label>
          <input type="email" id="email" name="email" required class="mt-1 p-2 w-full border rounded-md focus:ring-[#19658F] focus:border-[#19658F]">
        </div>
        <div>
          <label for="code" class="block text-sm font-medium text-gray-700">Mã xác nhận</label>
          <input type="text" id="code" name="code" required class="mt-1 p-2 w-full border rounded-md focus:ring-[#19658F] focus:border-[#19658F]">
        </div>
        <button type="button" onclick="requestCode()" class="w-full bg-[#19658F] text-white p-2 rounded-md hover:bg-[#F15E22] transition">Nhận mã</button>
        <button type="submit" class="w-full bg-[#F15E22] text-white p-2 rounded-md hover:bg-[#19658F] transition">Đăng nhập</button>
      </form>
      <p class="mt-4 text-center text-sm text-gray-600">
        Chưa đăng ký? Liên hệ <a href="mailto:email@dnqt.vn" class="text-[#19658F] hover:underline">email@dnqt.vn</a> hoặc 
        <a href="https://zalo.me/0908556220" class="text-[#19658F] hover:underline">Zalo: 0908556220</a>
      </p>
    </div>
  </div>

  <div id="welcome-section" class="hidden min-h-screen bg-gray-100 p-6">
    <div class="max-w-4xl mx-auto">
      <img src="/assets/logos/Logo-bgWhite.png" alt="Logo CLB" class="mx-auto h-24 mb-6">
      <h2 id="welcome-message" class="text-2xl font-bold text-[#19658F] mb-4"></h2>
      <p class="text-gray-700 mb-6">
        Chào mừng bạn đến với hệ thống của CLB Doanh nhân Quảng Trị Miền Nam. Vui lòng bảo vệ thông tin đăng nhập của bạn và không chia sẻ mã xác nhận với bất kỳ ai để đảm bảo an toàn bảo mật thông tin.
      </p>
      <div id="user-info" class="bg-white p-6 rounded-lg shadow-md mb-6"></div>
      <h3 class="text-xl font-semibold text-[#19658F] mb-4">Danh sách tài liệu</h3>
      <div id="docs-list" class="grid grid-cols-1 sm:grid-cols-2 gap-4"></div>
    </div>
  </div>

  <script>
    function showError(message) {
      const errorDiv = document.getElementById('error-message');
      errorDiv.textContent = message;
      errorDiv.classList.remove('hidden');
    }

    function requestCode() {
      const phone = document.getElementById('phone').value;
      const email = document.getElementById('email').value;
      google.script.run
        .withSuccessHandler(() => alert('Mã xác nhận đã được gửi qua email.'))
        .withFailureHandler((error) => showError(error.message || 'Thông tin không hợp lệ. Vui lòng liên hệ email@dnqt.vn hoặc Zalo: 0908556220.'))
        .requestCode(phone, email);
    }

    document.getElementById('login-form').addEventListener('submit', function(e) {
      e.preventDefault();
      const phone = document.getElementById('phone').value;
      const email = document.getElementById('email').value;
      const code = document.getElementById('code').value;
      google.script.run
        .withSuccessHandler((result) => {
          if (result.status === 'fail') throw new Error(result.message);
          const user = result.data;
          sessionStorage.setItem('userFullName', user.fullName);
          document.getElementById('login-section').classList.add('hidden');
          document.getElementById('welcome-section').classList.remove('hidden');
          document.getElementById('welcome-message').textContent = `Xin chào ${user.title} ${user.fullName}`;
          document.getElementById('user-info').innerHTML = `
            <p><strong>Xưng:</strong> ${user.title}</p>
            <p><strong>Họ và Tên:</strong> ${user.fullName}</p>
            <p><strong>Chức vụ trong CLB:</strong> ${user.clubPosition}</p>
            <p><strong>Chức danh trong Công ty:</strong> ${user.companyTitle}</p>
            <p><strong>Tên Công ty:</strong> ${user.companyName}</p>
          `;
          loadDocs();
        })
        .withFailureHandler((error) => showError(error.message || 'Đăng nhập thất bại. Vui lòng kiểm tra lại thông tin.'))
        .login(phone, email, code);
    });

    function loadDocs() {
      google.script.run
        .withSuccessHandler((result) => {
          if (result.status === 'fail') throw new Error(result.message);
          const docs = result.data;
          const docsList = document.getElementById('docs-list');
          docsList.innerHTML = '';
          docs.forEach(doc => {
            const docDiv = document.createElement('div');
            docDiv.className = 'bg-white p-4 rounded-lg shadow-md';
            docDiv.innerHTML = `
              <p><strong>Tên tài liệu:</strong> ${doc.name}</p>
              <p><strong>Cấp độ bảo mật:</strong> ${doc.securityLevel}</p>
              <a href="${doc.link}" target="_blank" onclick="logDocAccess('${doc.name}')" class="text-[#19658F] hover:underline">Xem tài liệu</a>
            `;
            docsList.appendChild(docDiv);
          });
        })
        .withFailureHandler(() => showError('Không thể tải danh sách tài liệu.'))
        .getDocs();
    }

    function logDocAccess(docName) {
      const fullName = sessionStorage.getItem('userFullName');
      google.script.run.logActivity(`Click vào tài liệu: ${docName}`, fullName);
    }
  </script>
</body>
</html>
