<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Doanh Nhân Tiêu Biểu CLB DNQT Miền Nam</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- AOS CSS -->
  <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
  <!-- QRCode.js -->
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  <style>
    .bizman-team.section {
      padding: 60px 0;
      background-color: #f5f7fa;
    }
    .bizman-section-title h2 {
      font-size: 2.5rem;
      font-weight: bold;
      text-align: center;
      margin-bottom: 20px;
      color: #19658F;
    }
    .bizman-team-member {
      background: #fff;
      border-radius: 15px;
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
      overflow: hidden;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      height: 100%; /* Stretch to fill container */
    }
    .bizman-team-member:hover {
      transform: translateY(-10px);
      box-shadow: 0 12px 24px rgba(0, 0, 0, 0.15);
    }
    .bizman-member-img {
      position: relative;
      padding-top: 100%; /* 1:1 aspect ratio */
    }
    .bizman-member-img img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top;
      border-radius: 15px 15px 0 0;
    }
    .bizman-member-info {
      padding: 20px;
      text-align: center;
      min-height: 120px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      color: #19658F;
    }
    .bizman-member-info h4 {
      font-size: 1.5rem;
      margin-bottom: 5px;
      color: #19658F;
    }
    .bizman-member-info span {
      color: #2A7DB5; /* Lighter blue variation */
      font-size: 1rem;
    }
    .bizman-social a {
      margin: 0 10px;
      font-size: 1.5rem;
      color: #19658F;
      transition: color 0.3s ease;
    }
    .bizman-social a:hover {
      color: #F15E22;
    }
    .bizman-read-more-btn {
      background: #19658F;
      color: #fff;
      border: none;
      padding: 8px 16px;
      border-radius: 5px;
      font-size: 0.9rem;
      margin-top: 10px;
      transition: background 0.3s ease;
    }
    .bizman-read-more-btn:hover {
      background: #F15E22;
    }
    .bizman-modal-content {
      border-radius: 15px;
      border: none;
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
    }
    .bizman-modal-header {
      background: #19658F;
      color: #fff;
      border-radius: 15px 15px 0 0;
      border-bottom: none;
    }
    .bizman-modal-header h5 {
      font-size: 1.8rem;
      font-weight: bold;
    }
    .bizman-modal-body {
      padding: 20px;
      color: #19658F;
    }
    .bizman-modal-dialog {
      width: 100%;
      max-width: 100%;
      margin: 0 auto;
    }
    .bizman-modal-body img.bizman-profile-img {
      width: 150px;
      height: 150px;
      object-fit: cover;
      object-position: top;
      border-radius: 10px;
      margin-bottom: 15px;
    }
    .bizman-modal-body .bizman-video-container {
      position: relative;
      padding-bottom: 56.25%;
      height: 0;
      overflow: hidden;
      margin-bottom: 20px;
    }
    .bizman-modal-body .bizman-video-container iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border-radius: 10px;
    }
    .bizman-modal-body .bizman-qr-code-container {
      text-align: center;
      margin-bottom: 20px;
    }
    .bizman-modal-body .bizman-qr-code-container canvas {
      max-width: 150px;
      border-radius: 5px;
      border: 1px solid #e6e9ed;
    }
    .bizman-modal-body p.bizman-description {
      font-size: 1rem;
      line-height: 1.6;
      color: #19658F;
      margin-bottom: 20px;
    }
    .bizman-modal-body .bizman-info-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.95rem;
    }
    .bizman-modal-body .bizman-info-table th, .bizman-modal-body .bizman-info-table td {
      padding: 10px;
      border-bottom: 1px solid #e6e9ed;
      text-align: left;
    }
    .bizman-modal-body .bizman-info-table th {
      font-weight: bold;
      color: #19658F;
      width: 30%;
    }
    .bizman-modal-body .bizman-info-table td {
      color: #2A7DB5;
    }
    .bizman-spinner-border {
      color: #F15E22 !important;
    }
    .bizman-error-icon, .bizman-error-btn {
      color: #F15E22 !important;
      background-color: #F15E22 !important;
    }
    @media (min-width: 768px) {
      .bizman-modal-dialog {
        width: 90%;
        max-width: 90%;
      }
      .bizman-team-member {
        min-height: 350px;
      }
      .bizman-member-img {
        padding-top: 100%;
      }
      .bizman-member-info h4 {
        font-size: 1.3rem;
      }
      .bizman-member-info span {
        font-size: 0.9rem;
      }
      .bizman-read-more-btn {
        font-size: 0.8rem;
        padding: 6px 12px;
      }
    }
    @media (min-width: 1200px) {
      .bizman-modal-dialog {
        width: 80%;
        max-width: 80%;
      }
    }
    @media (max-width: 576px) {
      .bizman-team-member {
        min-height: 300px;
      }
      .bizman-member-img {
        padding-top: 100%;
      }
      .bizman-member-info {
        min-height: 100px;
      }
      .bizman-member-info h4 {
        font-size: 1.2rem;
      }
      .bizman-member-info span {
        font-size: 0.85rem;
      }
      .bizman-modal-body img.bizman-profile-img {
        width: 100px;
        height: 100px;
      }
      .bizman-modal-body p.bizman-description {
        font-size: 0.9rem;
      }
      .bizman-modal-body .bizman-info-table th, .bizman-modal-body .bizman-info-table td {
        font-size: 0.85rem;
        padding: 8px;
      }
      .bizman-modal-body .bizman-qr-code-container canvas {
        max-width: 120px;
      }
    }
  </style>
</head>
<body>
  <section id="bizman-team" class="bizman-team section">
    <div class="container bizman-section-title" data-aos="fade-up">
      <h2>DOANH NHÂN TIÊU BIỂU CỦA CLB DNQT MIỀN NAM</h2>
    </div>
    <div class="container" data-aos="fade-up" data-aos-delay="100">
      <h3 class="text-center"><u id="bizman-group-title">Ban Điều Hành CLB</u></h3>
      <br>
      <div class="row gy-4" id="bizman-team-list">
        <!-- Team members will be dynamically inserted here -->
      </div>
    </div>
  </section>

  <!-- Modal Template -->
  <div class="modal fade" id="bizman-memberModal" tabindex="-1" aria-labelledby="bizman-memberModalLabel" aria-hidden="true">
    <div class="bizman-modal-dialog modal-dialog">
      <div class="bizman-modal-content">
        <div class="bizman-modal-header">
          <h5 class="modal-title" id="bizman-memberModalLabel"></h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="bizman-modal-body">
          <img id="bizman-modal-image" src="" alt="" class="bizman-profile-img d-block mx-auto">
          <h6 id="bizman-modal-member-id" class="text-center text-muted mb-2"></h6>
          <h6 id="bizman-modal-position" class="text-center text-muted mb-3"></h6>
          <div id="bizman-modal-video" class="bizman-video-container"></div>
          <div id="bizman-modal-qr-code" class="bizman-qr-code-container"></div>
          <p id="bizman-modal-description" class="bizman-description"></p>
          <table id="bizman-modal-info-table" class="bizman-info-table"></table>
        </div>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <!-- AOS JS -->
  <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
  <script>
    // Initialize AOS
    AOS.init();

    // Function to show loading spinner
    function showLoadingSpinner() {
      const teamList = document.getElementById('bizman-team-list');
      teamList.innerHTML = `
        <div class="col-12 text-center py-5">
          <div class="spinner-border bizman-spinner-border" style="width: 3rem; height: 3rem;" role="status">
            <span class="visually-hidden">Loading...</span>
          </div>
          <p class="mt-3" style="color: #F15E22;">Đang tải danh sách doanh nhân...</p>
        </div>
      `;
    }

    // Function to show error message
    function showError() {
      const teamList = document.getElementById('bizman-team-list');
      teamList.innerHTML = `
        <div class="col-12 text-center py-5">
          <i class="bi bi-exclamation-triangle fs-1 bizman-error-icon"></i>
          <p class="mt-2">Không thể tải danh sách doanh nhân</p>
          <button onclick="fetchTeamMembers()" class="btn btn-sm bizman-error-btn" style="color: white;">
            <i class="bi bi-arrow-clockwise"></i> Thử lại
          </button>
        </div>
      `;
    }

    // Function to get YouTube video ID from URL
    function getYouTubeId(url) {
      const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|&v=)([^#&?]*).*/;
      const match = url.match(regExp);
      return match && match[2].length === 11 ? match[2] : null;
    }

    // Function to set uniform height for team members
    function setUniformCardHeight() {
      const cards = document.querySelectorAll('.bizman-team-member');
      let maxHeight = 0;

      // Reset heights to measure natural height
      cards.forEach(card => {
        card.style.height = 'auto';
        const height = card.offsetHeight;
        maxHeight = Math.max(maxHeight, height);
      });

      // Apply max height to all cards
      cards.forEach(card => {
        card.style.height = `${maxHeight}px`;
      });
    }

    // Function to fetch and render team members
    async function fetchTeamMembers() {
      try {
        showLoadingSpinner();
        // Check localStorage cache
        const cacheKey = `teamMembers_${new URLSearchParams(window.location.search).get('GroupCode') || '1'}`;
        const cachedData = localStorage.getItem(cacheKey);
        if (cachedData) {
          renderTeamMembers(JSON.parse(cachedData));
          return;
        }

        // Get Group Code from URL parameter or default to 1
        const urlParams = new URLSearchParams(window.location.search);
        const groupCode = urlParams.get('GroupCode') || '1';

        // Update group title based on Group Code
        const groupTitle = document.getElementById('bizman-group-title');
        groupTitle.textContent = groupCode === '1' ? 'Ban Điều Hành CLB' : `Nhóm ${groupCode}`;

        const response = await fetch(`https://script.google.com/macros/s/AKfycbzF3yR4dpLgprufwHiav7Cj0SfWTWYWtQzHtoTBjrN4DqCOBNcyddp4u6IZyMpdpMV_/exec?GroupCode=${groupCode}`);
        if (!response.ok) {
          throw new Error('Network response was not ok');
        }
        const members = await response.json();

        // Cache data in localStorage
        localStorage.setItem(cacheKey, JSON.stringify(members));

        // Render team members
        renderTeamMembers(members);
      } catch (error) {
        console.error('Error fetching team members:', error);
        showError();
      }
    }

    // Function to render team members
    function renderTeamMembers(members) {
      const teamList = document.getElementById('bizman-team-list');
      const fragment = document.createDocumentFragment();

      members.forEach((member, index) => {
        const col = document.createElement('div');
        col.className = 'col-xl-3 col-md-6 col-12 d-flex';
        col.setAttribute('data-aos', 'zoom-in');
        col.setAttribute('data-aos-delay', (200 + index * 100).toString());
        col.innerHTML = `
          <div class="bizman-team-member">
            <div class="bizman-member-img">
              <img src="${member.image}" class="img-fluid" alt="${member.name}" loading="lazy">
            </div>
            <div class="bizman-member-info">
              <div class="bizman-social">
                ${member.businessCard ? `<a href="${member.businessCard}" target="_blank"><i class="bi bi-card-text"></i></a>` : ''}
                ${member.facebook ? `<a href="${member.facebook}" target="_blank"><i class="bi bi-facebook"></i></a>` : ''}
                ${member.zalo ? `<a href="${member.zalo}" target="_blank"><i class="bi bi-chat-dots"></i></a>` : ''}
              </div>
              <h4>${member.name}</h4>
              <span>${member.position || 'Thành viên'}</span>
              ${member.description || member.video || member.sector || member.memberType || member.joinDate || member.organizerMessage || member.businessSuggestions || member.partnerSuggestions || member.optional1 || member.optional2 || member.optional3 || member.optional4 || member.qrCodeText ? `<button class="bizman-read-more-btn" data-bs-toggle="modal" data-bs-target="#bizman-memberModal" data-member='${JSON.stringify(member).replace(/'/g, "&apos;").replace(/"/g, '&quot;')}'>Đọc thêm</button>` : ''}
            </div>
          </div>
        `;
        fragment.appendChild(col);
      });

      teamList.innerHTML = ''; // Clear spinner
      teamList.appendChild(fragment);

      // Set uniform card height
      setUniformCardHeight();
      window.addEventListener('resize', setUniformCardHeight);

      // Add event listeners for modal buttons
      document.querySelectorAll('.bizman-read-more-btn').forEach(button => {
        button.addEventListener('click', () => {
          const member = JSON.parse(button.dataset.member.replace(/&quot;/g, '"').replace(/&apos;/g, "'"));
          document.getElementById('bizman-memberModalLabel').textContent = member.name;
          document.getElementById('bizman-modal-image').src = member.image;
          document.getElementById('bizman-modal-image').alt = member.name;
          document.getElementById('bizman-modal-member-id').textContent = member.memberId ? `Mã Doanh Nhân: ${member.memberId}` : '';
          document.getElementById('bizman-modal-position').textContent = member.position || 'Thành viên';
          document.getElementById('bizman-modal-description').textContent = member.description || '';

          // Embed YouTube video if available
          const videoContainer = document.getElementById('bizman-modal-video');
          if (member.video) {
            const videoId = getYouTubeId(member.video);
            if (videoId) {
              videoContainer.innerHTML = `<iframe src="https://www.youtube.com/embed/${videoId}" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>`;
            } else {
              videoContainer.innerHTML = '';
            }
          } else {
            videoContainer.innerHTML = '';
          }

          // Generate QR code if available
          const qrCodeContainer = document.getElementById('bizman-modal-qr-code');
          qrCodeContainer.innerHTML = '';
          if (member.qrCodeText) {
            const qrDiv = document.createElement('div');
            qrCodeContainer.appendChild(qrDiv);
            new QRCode(qrDiv, {
              text: member.qrCodeText,
              width: 150,
              height: 150,
              colorDark: '#19658F',
              colorLight: '#ffffff',
              correctLevel: QRCode.CorrectLevel.H
            });
          }

          // Populate info table
          const infoTable = document.getElementById('bizman-modal-info-table');
          infoTable.innerHTML = '';
          const fields = [
            { label: 'Lĩnh vực kinh doanh', value: member.sector },
            { label: 'Phân loại thành viên', value: member.memberType },
            { label: 'Ngày tham gia CLB', value: member.joinDate },
            { label: 'Lời nhắn từ Ban tổ chức', value: member.organizerMessage },
            { label: 'Gợi ý cho doanh nghiệp', value: member.businessSuggestions },
            { label: 'Gợi ý cho khách hàng/đối tác', value: member.partnerSuggestions },
            { label: 'Tùy chọn 1', value: member.optional1 },
            { label: 'Tùy chọn 2', value: member.optional2 },
            { label: 'Tùy chọn 3', value: member.optional3 },
            { label: 'Tùy chọn 4', value: member.optional4 }
          ];
          fields.forEach(field => {
            if (field.value) {
              const row = document.createElement('tr');
              row.innerHTML = `<th>${field.label}</th><td>${field.value}</td>`;
              infoTable.appendChild(row);
            }
          });
        });
      });
    }

    // Debounce fetchTeamMembers to prevent multiple calls
    let isFetching = false;
    function debouncedFetchTeamMembers() {
      if (isFetching) return;
      isFetching = true;
      fetchTeamMembers().finally(() => {
        isFetching = false;
      });
    }

    // Fetch team members when the page loads
    window.onload = debouncedFetchTeamMembers;
  </script>
</body>
</html>
