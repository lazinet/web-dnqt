<!DOCTYPE html>
<html lang="en">
<head>
<!-- Google tag (gtag.js) -->

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Team Members</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- AOS CSS -->
  <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
  <!-- QRCode.js -->
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  <style>
    .team.section {
      padding: 60px 0;
      background-color: #f8f9fa;
    }
    .section-title h2 {
      font-size: 2.5rem;
      font-weight: bold;
      text-align: center;
      margin-bottom: 20px;
      color: #1a3c6d;
    }
    .team-member {
      background: #fff;
      border-radius: 15px;
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
      overflow: hidden;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }
    .team-member:hover {
      transform: translateY(-10px);
      box-shadow: 0 12px 24px rgba(0, 0, 0, 0.15);
    }
    .member-img img {
      width: 100%;
      height: 300px;
      object-fit: cover;
      object-position: top;
      border-radius: 15px 15px 0 0;
    }
    .member-info {
      padding: 20px;
      text-align: center;
    }
    .member-info h4 {
      font-size: 1.5rem;
      margin-bottom: 5px;
      color: #333;
    }
    .member-info span {
      color: #777;
      font-size: 1rem;
    }
    .social a {
      margin: 0 10px;
      font-size: 1.5rem;
      color: #007bff;
      transition: color 0.3s ease;
    }
    .social a:hover {
      color: #0056b3;
    }
    .read-more-btn {
      background: #007bff;
      color: #fff;
      border: none;
      padding: 8px 16px;
      border-radius: 5px;
      font-size: 0.9rem;
      margin-top: 10px;
      transition: background 0.3s ease;
    }
    .read-more-btn:hover {
      background: #0056b3;
    }
    .modal-content {
      border-radius: 15px;
      border: none;
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
    }
    .modal-header {
      background: #007bff;
      color: #fff;
      border-radius: 15px 15px 0 0;
      border-bottom: none;
    }
    .modal-header h5 {
      font-size: 1.8rem;
      font-weight: bold;
    }
    .modal-body {
      padding: 20px;
    }
    .modal-body img.profile-img {
      width: 150px;
      height: 150px;
      object-fit: cover;
      object-position: top;
      border-radius: 10px;
      margin-bottom: 15px;
    }
    .modal-body .video-container {
      position: relative;
      padding-bottom: 56.25%; /* 16:9 aspect ratio */
      height: 0;
      overflow: hidden;
      margin-bottom: 20px;
    }
    .modal-body .video-container iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border-radius: 10px;
    }
    .modal-body .qr-code-container {
      text-align: center;
      margin-bottom: 20px;
    }
    .modal-body .qr-code-container canvas {
      max-width: 150px;
      border-radius: 5px;
      border: 1px solid #eee;
    }
    .modal-body p.description {
      font-size: 1rem;
      line-height: 1.6;
      color: #333;
      margin-bottom: 20px;
    }
    .modal-body .info-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.95rem;
    }
    .modal-body .info-table th, .modal-body .info-table td {
      padding: 10px;
      border-bottom: 1px solid #eee;
      text-align: left;
    }
    .modal-body .info-table th {
      font-weight: bold;
      color: #1a3c6d;
      width: 30%;
    }
    .modal-body .info-table td {
      color: #333;
    }
    @media (max-width: 576px) {
      .modal-body img.profile-img {
        width: 100px;
        height: 100px;
      }
      .modal-body p.description {
        font-size: 0.9rem;
      }
      .modal-body .info-table th, .modal-body .info-table td {
        font-size: 0.85rem;
        padding: 8px;
      }
      .modal-body .qr-code-container canvas {
        max-width: 120px;
      }
    }
  </style>
</head>
<body>
  <section id="team" class="team section">
    <div class="container section-title" data-aos="fade-up">
      <h2>DOANH NHÂN TIÊU BIỂU CỦA CLB DNQT MIỀN NAM</h2>
    </div>
    <div class="container" data-aos="fade-up" data-aos-delay="100">
      <h3 class="text-center"><u id="group-title">Ban Điều Hành CLB</u></h3>
      <br>
      <div class="row gy-5" id="team-list">
        <!-- Team members will be dynamically inserted here -->
      </div>
    </div>
  </section>

  <!-- Modal Template -->
  <div class="modal fade" id="memberModal" tabindex="-1" aria-labelledby="memberModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="memberModalLabel"></h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <img id="modal-image" src="" alt="" class="profile-img d-block mx-auto">
          <h6 id="modal-member-id" class="text-center text-muted mb-2"></h6>
          <h6 id="modal-position" class="text-center text-muted mb-3"></h6>
          <div id="modal-video" class="video-container"></div>
          <div id="modal-qr-code" class="qr-code-container"></div>
          <p id="modal-description" class="description"></p>
          <table id="modal-info-table" class="info-table"></table>
        </div>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <!-- AOS JS -->
  <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
  <script>
    // Initialize AOS
    AOS.init();

    // Function to get YouTube video ID from URL
    function getYouTubeId(url) {
      const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|&v=)([^#&?]*).*/;
      const match = url.match(regExp);
      return match && match[2].length === 11 ? match[2] : null;
    }

    // Function to fetch and render team members
    async function fetchTeamMembers() {
      try {
        // Get Group Code from URL parameter or default to 1
        const urlParams = new URLSearchParams(window.location.search);
        const groupCode = urlParams.get('GroupCode') || '1';

        // Update group title based on Group Code
        const groupTitle = document.getElementById('group-title');
        groupTitle.textContent = groupCode === '1' ? 'Ban Điều Hành CLB' : `Nhóm ${groupCode}`;

        // Use CORS proxy for local testing
        // const corsProxy = 'http://localhost:8080/'; // Or use 'https://cors-anywhere.herokuapp.com/' for public proxy
        const response = await fetch(`https://script.google.com/macros/s/AKfycbzF3yR4dpLgprufwHiav7Cj0SfWTWYWtQzHtoTBjrN4DqCOBNcyddp4u6IZyMpdpMV_/exec?GroupCode=${groupCode}`);
        const members = await response.json();

        const teamList = document.getElementById('team-list');
        teamList.innerHTML = ''; // Clear existing content

        members.forEach((member, index) => {
          const col = document.createElement('div');
          col.className = 'col-xl-3 col-md-6 d-flex';
          col.setAttribute('data-aos', 'zoom-in');
          col.setAttribute('data-aos-delay', (200 + index * 100).toString());
          col.innerHTML = `
            <div class="team-member">
              <div class="member-img">
                <img src="${member.image}" class="img-fluid" alt="${member.name}">
              </div>
              <div class="member-info">
                <div class="social">
                  ${member.businessCard ? `<a href="${member.businessCard}" target="_blank"><i class="bi bi-card-text"></i></a>` : ''}
                  ${member.facebook ? `<a href="${member.facebook}" target="_blank"><i class="bi bi-facebook"></i></a>` : ''}
                  ${member.zalo ? `<a href="${member.zalo}" target="_blank"><i class="bi bi-chat-dots"></i></a>` : ''}
                </div>
                <h4>${member.name}</h4>
                <span>${member.position || 'Thành viên'}</span>
                ${member.description || member.video || member.sector || member.memberType || member.joinDate || member.organizerMessage || member.businessSuggestions || member.partnerSuggestions || member.optional1 || member.optional2 || member.optional3 || member.optional4 || member.qrCodeText ? `<button class="read-more-btn" data-bs-toggle="modal" data-bs-target="#memberModal" data-member='${JSON.stringify(member).replace(/'/g, "&apos;").replace(/"/g, '&quot;')}'>Đọc thêm</button>` : ''}
              </div>
            </div>
          `;
          teamList.appendChild(col);
        });

        // Add event listeners for modal buttons
        document.querySelectorAll('.read-more-btn').forEach(button => {
          button.addEventListener('click', () => {
            const member = JSON.parse(button.dataset.member.replace(/&quot;/g, '"').replace(/&apos;/g, "'"));
            document.getElementById('memberModalLabel').textContent = member.name;
            document.getElementById('modal-image').src = member.image;
            document.getElementById('modal-image').alt = member.name;
            document.getElementById('modal-member-id').textContent = member.memberId ? `Mã Doanh Nhân: ${member.memberId}` : '';
            document.getElementById('modal-position').textContent = member.position || 'Thành viên';
            document.getElementById('modal-description').textContent = member.description || '';

            // Embed YouTube video if available
            const videoContainer = document.getElementById('modal-video');
            if (member.video) {
              const videoId = getYouTubeId(member.video);
              if (videoId) {
                videoContainer.innerHTML = `<iframe src="https://www.youtube.com/embed/${videoId}" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>`;
              } else {
                videoContainer.innerHTML = '';
              }
            } else {
              videoContainer.innerHTML = '';
            }

            // Generate QR code if available
            const qrCodeContainer = document.getElementById('modal-qr-code');
            qrCodeContainer.innerHTML = '';
            if (member.qrCodeText) {
              const qrDiv = document.createElement('div');
              qrCodeContainer.appendChild(qrDiv);
              new QRCode(qrDiv, {
                text: member.qrCodeText,
                width: 150,
                height: 150,
                colorDark: '#000000',
                colorLight: '#ffffff',
                correctLevel: QRCode.CorrectLevel.H
              });
            }

            // Populate info table
            const infoTable = document.getElementById('modal-info-table');
            infoTable.innerHTML = '';
            const fields = [
              { label: 'Lĩnh vực kinh doanh', value: member.sector },
              { label: 'Phân loại thành viên', value: member.memberType },
              { label: 'Ngày tham gia CLB', value: member.joinDate },
              { label: 'Lời nhắn từ Ban tổ chức', value: member.organizerMessage },
              { label: 'Gợi ý cho doanh nghiệp', value: member.businessSuggestions },
              { label: 'Gợi ý cho khách hàng/đối tác', value: member.partnerSuggestions },
              { label: 'Tùy chọn 1', value: member.optional1 },
              { label: 'Tùy chọn 2', value: member.optional2 },
              { label: 'Tùy chọn 3', value: member.optional3 },
              { label: 'Tùy chọn 4', value: member.optional4 }
            ];
            fields.forEach(field => {
              if (field.value) {
                const row = document.createElement('tr');
                row.innerHTML = `<th>${field.label}</th><td>${field.value}</td>`;
                infoTable.appendChild(row);
              }
            });
          });
        });
      } catch (error) {
        console.error('Error fetching team members:', error);
      }
    }

    // Fetch team members when the page loads
    window.onload = fetchTeamMembers;
  </script>
</body>
</html>
