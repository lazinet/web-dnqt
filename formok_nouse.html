<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Form</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="container mt-5">
    <h1 class="text-center">Contact Form</h1>
    <form id="contactForm" class="mt-4">
      <div class="mb-3">
        <label for="name" class="form-label">Your Name</label>
        <input type="text" class="form-control" id="name" name="name" required>
      </div>
      <div class="mb-3">
        <label for="email" class="form-label">Your Email</label>
        <input type="email" class="form-control" id="email" name="email" required>
      </div>
      <div class="mb-3">
        <label for="subject" class="form-label">Subject</label>
        <input type="text" class="form-control" id="subject" name="subject" required>
      </div>
      <div class="mb-3">
        <label for="message" class="form-label">Message</label>
        <textarea class="form-control" id="message" name="message" rows="4" required></textarea>
      </div>
      <button type="submit" class="btn btn-primary">Send Message</button>
    </form>
    <div id="responseMessage" class="mt-3"></div>
  </div>

  <!-- JavaScript -->
  <script>
    document.getElementById('contactForm').addEventListener('submit', async (event) => {
      event.preventDefault(); // Ngăn hành vi mặc định của form

      // Lấy dữ liệu từ form
      const formData = {
        name: document.getElementById('name').value,
        email: document.getElementById('email').value,
        subject: document.getElementById('subject').value,
        message: document.getElementById('message').value,
      };

      try {
        // Gửi yêu cầu POST với no-cors
        await fetch('https://script.google.com/macros/s/AKfycbwG1Y3N2Zv-l-i8cpTNGkOf9TW5QHQcKgGtbOiXkqNflefepgPI9LiBvFsJXiM2C06f/exec', {
          method: 'POST',
          mode: 'no-cors', // Bỏ qua kiểm tra CORS
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(formData),
        });

        // Hiển thị thông báo thành công
        document.getElementById('responseMessage').innerHTML =
          `<div class="alert alert-success">Form submitted successfully!</div>`;
      } catch (error) {
        // Hiển thị thông báo lỗi
        document.getElementById('responseMessage').innerHTML =
          `<div class="alert alert-danger">There was an error submitting the form.</div>`;
        console.error('Error:', error);
      }
    });
  </script>
</body>
</html>
