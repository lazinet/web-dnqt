<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover" />
  <meta name="description" content="Viettel Software's Product Catalogue" />
  <title>Viettel Software's Product Catalogue</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/gojs@2.3.10/assets/css/style.min.css" />
  <link href="https://fonts.googleapis.com/css?family=Open+Sans" rel="stylesheet">

  <style>
    body {
      font-family: 'Open Sans', sans-serif;
    }

    h2 {
      text-align: center;
    }

    .background-div {
      height: 95vh;
      background: white;
    }

    #container {
      display: flex;
      align-items: center;
    }
    #myDiagramDiv {
      width: 100%;
      height: 700px;
      background-color: #ffffff;
    }
    .gradient-text {
      background: linear-gradient(to left, #FF0066, #EA1C2D);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      display: inline;
      padding: 10px;
    }

    #downloadLinkContainer,
    #toggleButton {
      padding: 10px;
    }

    table {
      font-family: Arial, sans-serif;
      margin-bottom: 20px;
    }

    th {
      background: linear-gradient(to bottom, #FF0066, #EA1C2D);
      text-align: left;
      padding: 10px;
      border: 1px solid #dddddd;
    }

    tr:nth-child(even) {
      background-color: #f2f2f2;
    }

    tr:nth-child(odd) {
      background-color: #ffffff;
    }

    td {
      padding: 10px;
      border: 1px solid #dddddd;
    }

    table,
    th,
    td {
      border: 1px solid #dddddd;
      border-collapse: collapse;
    }

    th {
      color: #ffffff;
      font-weight: bold;
    }

    tr:hover {
      background-color: #d4d4d4;
    }

    input[type="file"],
    button {
      background: linear-gradient(to bottom, #FF0066, #EA1C2D);
      color: #fff;
      padding: 10px 20px;
      border: none;
      cursor: pointer;
    }

    button:hover {
      background: linear-gradient(to bottom, #EA1C2D, #A50021);
    }
  </style>

  <script lang="javascript" src="https://cdn.sheetjs.com/xlsx-0.20.0/package/dist/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/0.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>


</head>

<body>
  <div
    style="position: absolute; top: 25px; left: 25px; width: 200px; height: 70px; background-color: white; z-index: 9999; display: flex; align-items: center; justify-content: center; overflow: hidden;">
    <img src="https://www.viettelsoftware.com/images/logo-1-2x-1.png" alt="Viettel Software's Logo"
      style="max-width: 50%; max-height: auto; object-fit: contain;">
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gojs@2.3.10/release/go.min.js"></script>

  <div id="allSampleContent" class="p-4 w-full">

    <script src="https://cdn.jsdelivr.net/npm/gojs@2.3.10/extensions/DataInspector.js"></script>


    <script id="code">
      let myDiagram;

      function init() {
        const $ = go.GraphObject.make;  // for conciseness in defining templates

        myDiagram =
          new go.Diagram("myDiagramDiv", // must be the ID or reference to div
            {
              allowCopy: false,
              allowDelete: false,
              maxSelectionCount: 1, // users can select only one part at a time
              validCycle: go.Diagram.CycleDestinationTree, // make sure users can only create trees
              "clickCreatingTool.archetypeNodeData": { // allow double-click in background to create a new node
                Full_Name: "Product",
                Professional_Title: "Description",
                Department_Team: "",
                Lead_Title: "",
                parent: "",
                Portrait_URL: "",
                Profile_URL: "",
                Remarks: ""
              },
              "clickCreatingTool.insertPart": function (loc) {  // method override must be function, not =>
                const node = go.ClickCreatingTool.prototype.insertPart.call(this, loc);
                if (node !== null) {
                  this.diagram.select(node);
                  this.diagram.commandHandler.scrollToPart(node);
                  this.diagram.commandHandler.editTextBlock(node.findObject("NAMETB"));
                }
                return node;
              },
              layout:
                $(go.TreeLayout,
                  {
                    treeStyle: go.TreeLayout.StyleLastParents,
                    arrangement: go.TreeLayout.ArrangementVertical,
                    angle: 90,
                    layerSpacing: 35,
                    alternateAngle: 90,
                    alternateLayerSpacing: 35,
                    alternateAlignment: go.TreeLayout.AlignmentBus,
                    alternateNodeSpacing: 20
                  }),
              "undoManager.isEnabled": true // enable undo & redo
            });

        myDiagram.addDiagramListener("Modified", e => {
          const button = document.getElementById("SaveButton");
          if (button) button.disabled = !myDiagram.isModified;
          const idx = document.title.indexOf("*");
          if (myDiagram.isModified) {
            if (idx < 0) document.title += "*";
          } else {
            if (idx >= 0) document.title = document.title.slice(0, idx);
          }
        });

        myDiagram.layout.commitNodes = function () {  // method override must be function, not =>
          go.TreeLayout.prototype.commitNodes.call(this);  // do the standard behavior

          myDiagram.layout.network.vertexes.each(v => {
            if (v.node) {
              const shape = v.node.findObject("SHAPE");
              if (shape) shape.stroke = "#D9D9D9";
            }
          });
        };


        // this is used to determine feedback during drags
        function mayWorkFor(node1, node2) {
          if (!(node1 instanceof go.Node)) return false;  // must be a Node
          if (node1 === node2) return false;  // cannot work for yourself
          if (node2.isInTreeOf(node1)) return false;  // cannot work for someone who works for you
          return true;
        }

        function textStyle() {
          return { font: "9pt  Segoe UI,sans-serif", stroke: "black" };
        }

        // This converter is used by the Portrait Picture.
        function findHeadShot(Portrait_URL) {
          return Portrait_URL || "https://viettelsoftware.com/images/path-50763.svg";
        }

        // define the Node template
        myDiagram.nodeTemplate =
          $(go.Node, "Spot",
            {
              selectionObjectName: "BODY",
              mouseEnter: (e, node) => node.findObject("BUTTON").opacity = node.findObject("BUTTONX").opacity = 1,
              mouseLeave: (e, node) => node.findObject("BUTTON").opacity = node.findObject("BUTTONX").opacity = 0,
              // handle dragging a Node onto a Node to (maybe) change the reporting relationship
              mouseDragEnter: (e, node, prev) => {
                const diagram = node.diagram;
                const selnode = diagram.selection.first();
                if (!mayWorkFor(selnode, node)) return;
                const shape = node.findObject("SHAPE");
                if (shape) {
                  shape._prevFill = shape.fill;  // remember the original brush
                  shape.fill = "darkred";
                }
              },
              mouseDragLeave: (e, node, next) => {
                const shape = node.findObject("SHAPE");
                if (shape && shape._prevFill) {
                  shape.fill = shape._prevFill;  // restore the original brush
                }
              },
              mouseDrop: (e, node) => {
                const diagram = node.diagram;
                const selnode = diagram.selection.first();  // assume just one Node in selection
                if (mayWorkFor(selnode, node)) {
                  // find any existing link into the selected node
                  const link = selnode.findTreeParentLink();
                  if (link !== null) {  // reconnect any existing link
                    link.fromNode = node;
                  } else {  // else create a new link
                    diagram.toolManager.linkingTool.insertLink(node, node.port, selnode, selnode.port);
                  }
                }
              }
            },
            // for sorting, have the Node.text be the data.Full_Name
            new go.Binding("text", "Full_Name"),
            // bind the Part.layerName to control the Node's layer depending on whether it isSelected
            new go.Binding("layerName", "isSelected", sel => sel ? "Foreground" : "").ofObject(),
            $(go.Panel, "Auto",
              { name: "BODY" },
              // define the node's outer shape
              $(go.Shape, "Rectangle",
                { name: "SHAPE", fill: "white", stroke: '#D9D9D9', strokeWidth: 1, portId: "" }), // Thay đổi màu nền của node ở đây 1e6847 "linear-gradient(to top, #a8d7c9, #6db1d1)"
              $(go.Panel, "Horizontal",
                $(go.Picture,
                  {
                    name: "Picture",
                    desiredSize: new go.Size(100, 100),
                    margin: 1.5,
                    source: "https://viettelsoftware.com/images/path-50763.svg" // the default image
                  },
                  new go.Binding("source", "Portrait_URL", findHeadShot)),

                // define the panel where the text will appear
                $(go.Panel, "Table",
                  {
                    minSize: new go.Size(160, NaN),
                    maxSize: new go.Size(160, NaN),
                    margin: new go.Margin(6, 10, 0, 6),
                    defaultAlignment: go.Spot.Left
                  },
                  $(go.RowColumnDefinition, { column: 2, width: 4 }),

                  // Trường Full_Name
                  $(go.TextBlock, textStyle(),  // the name
                    {
                      name: "NAMETB",
                      row: 0, column: 0, columnSpan: 5,
                      font: "bold 11pt Segoe UI,sans-serif",
                      editable: true, isMultiline: false,
                      minSize: new go.Size(50, 16),
                      click: function (e, tb) {
                        const node = tb.part;
                        const Profile_URL = node.data.Profile_URL;
                        if (Profile_URL) {
                          window.open(Profile_URL, "_blank");
                        }
                      }
                    },
                    new go.Binding("text", "Full_Name").makeTwoWay()),

                  // Trường Professional
                  $(go.TextBlock, textStyle(),
                    {
                      row: 1, column: 0, columnSpan: 4,
                      editable: true, isMultiline: false,
                      minSize: new go.Size(50, 14),
                      // margin: new go.Margin(0, 0, 0, 0)
                    },
                    new go.Binding("text", "Professional_Title").makeTwoWay()),

                  $(go.TextBlock, textStyle(),  // Chỉ hiển thị
                    {
                      row: 2, column: 0, columnSpan: 5,
                      font: "italic 8pt Segoe UI,sans-serif",
                      wrap: go.TextBlock.WrapFit,
                      editable: true,  // by default newlines are allowed
                      minSize: new go.Size(100, 14)
                    },
                    new go.Binding("text", function (node) {
                      // Kiểm tra nếu trường "Lead_Title" không trống
                      if (node.data.Lead_Title !== "") {
                        // Trả về giá trị của trường "Lead_Title"                  
                        return node.data.Lead_Title;
                      } else {
                        // Trả về giá trị của trường "Department_Team"
                        return node.data.Department_Team;
                      }
                    }).ofObject()
                  ),
                ) // end Table Panel
              ) // end Horizontal Panel
            ), // end Auto Panel
            $("Button",
              $(go.Shape, "PlusLine", { width: 10, height: 10 }),
              {
                name: "BUTTON", alignment: go.Spot.Right, opacity: 0,  // initially not visible
                click: (e, button) => addEmployee(button.part)
              },
              // button is visible either when node is selected or on mouse-over
              new go.Binding("opacity", "isSelected", s => s ? 1 : 0).ofObject()
            ),
            new go.Binding("isTreeExpanded").makeTwoWay(),
            $("TreeExpanderButton",
              {
                name: "BUTTONX", alignment: go.Spot.Bottom, opacity: 0,  // initially not visible
                "_treeExpandedFigure": "TriangleUp",
                "_treeCollapsedFigure": "TriangleDown"
              },
              // button is visible either when node is selected or on mouse-over
              new go.Binding("opacity", "isSelected", s => s ? 1 : 0).ofObject()
            )
          );  // end Node, a Spot Panel

        function addEmployee(node) {
          if (!node) return;
          const thisemp = node.data;
          myDiagram.startTransaction("add employee");
          const newemp = {
            Full_Name: "Area/ Software", Professional_Title: "Descriptions", Department_Team: "", Lead_Title: "Projects",
            Portrait_URL: "https://viettelsoftware.com/images/path-50763.svg", Profile_URL: "", Remarks: "", parent: thisemp.key
          };

          myDiagram.model.addNodeData(newemp);
          const newnode = myDiagram.findNodeForData(newemp);
          if (newnode) newnode.location = node.location;
          myDiagram.commitTransaction("add employee");
          myDiagram.commandHandler.scrollToPart(newnode);
        }

        myDiagram.nodeTemplate.contextMenu =
          $("ContextMenu",
            $("ContextMenuButton",
              $(go.TextBlock, "Add Employee"),
              {
                click: (e, button) => addEmployee(button.part.adornedPart)
              }
            ),
            $("ContextMenuButton",
              $(go.TextBlock, "Vacate Position"),
              {
                click: (e, button) => {
                  const node = button.part.adornedPart;
                  if (node !== null) {
                    const thisemp = node.data;
                    myDiagram.startTransaction("vacate");
                    myDiagram.model.setDataProperty(thisemp, "Full_Name", "(Vacant)");
                    myDiagram.model.setDataProperty(thisemp, "Portrait_URL", "");
                    myDiagram.model.setDataProperty(thisemp, "Remarks", "");
                    myDiagram.commitTransaction("vacate");
                  }
                }
              }
            ),
            $("ContextMenuButton",
              $(go.TextBlock, "Remove Role"),
              {
                click: (e, button) => {
                  // reparent the subtree to this node's boss, then remove the node
                  const node = button.part.adornedPart;
                  if (node !== null) {
                    myDiagram.startTransaction("reparent remove");
                    const chl = node.findTreeChildrenNodes();
                    // iterate through the children and set their parent key to our selected node's parent key
                    while (chl.next()) {
                      const emp = chl.value;
                      myDiagram.model.setParentKeyForNodeData(emp.data, node.findTreeParentNode().data.key);
                    }
                    // and now remove the selected node itself
                    myDiagram.model.removeNodeData(node.data);
                    myDiagram.commitTransaction("reparent remove");
                  }
                }
              }
            ),
            $("ContextMenuButton",
              $(go.TextBlock, "Remove Department_Team"),
              {
                click: (e, button) => {
                  // remove the whole subtree, including the node itself
                  const node = button.part.adornedPart;
                  if (node !== null) {
                    myDiagram.startTransaction("remove dept");
                    myDiagram.removeParts(node.findTreeParts());
                    myDiagram.commitTransaction("remove dept");
                  }
                }
              }
            )
          );

        // define the Link template
        myDiagram.linkTemplate =
          $(go.Link, go.Link.Orthogonal,
            { layerName: "Background", corner: 5 },
            $(go.Shape, { strokeWidth: 1.5, stroke: "#EA1C2D" }));  // the link shape

        // read in the JSON-format data from the "mySavedModel" element
        load();

       

        // Căn chỉnh tự động
        document.getElementById('zoomToFit').addEventListener('click', () => myDiagram.commandHandler.zoomToFit());

        document.getElementById('centerRoot').addEventListener('click', () => {
          myDiagram.scale = 1;
          myDiagram.commandHandler.scrollToPart(myDiagram.findNodeForKey(1));
        });

        document.getElementById("exportToSVG").addEventListener("click", makeSvg);

      } // Kế thúc hàm init

      // Ảnh svg
      function myCallback(blob) {
        var url = window.URL.createObjectURL(blob);
        var filename = "Viettel Software Portfolio " + timeNow() + ".svg";

        var a = document.createElement("a");
        a.style = "display: none";
        a.href = url;
        a.download = filename;

        // IE 11
        if (window.navigator.msSaveBlob !== undefined) {
          window.navigator.msSaveBlob(blob, filename);
          return;
        }

        document.body.appendChild(a);
        requestAnimationFrame(() => {
          a.click();
          window.URL.revokeObjectURL(url);
          document.body.removeChild(a);
        });
      }

      function makeSvg() {
        var svg = myDiagram.makeSvg({ scale: 1, background: "#FFDDDD" });
        var svgstr = new XMLSerializer().serializeToString(svg);
        var blob = new Blob([svgstr], { type: "image/svg+xml" });
        myCallback(blob);

      }

      // Show the diagram's model in JSON format
      function save() {
        document.getElementById("mySavedModel").value = myDiagram.model.toJson();
        myDiagram.isModified = false;
      }
      function load() {
        myDiagram.model = go.Model.fromJson(document.getElementById("mySavedModel").value);
        let lastkey = 1;
        myDiagram.model.makeUniqueKeyFunction = (model, data) => {
          let k = data.key || lastkey;
          while (model.findNodeDataForKey(k)) k++;
          data.key = lastkey = k;
          return k;
        };
      }

      function timeNow() {
        var currentTime = new Date();

        // Định dạng thời gian
        var year = currentTime.getFullYear();
        var month = ('0' + (currentTime.getMonth() + 1)).slice(-2);
        var day = ('0' + currentTime.getDate()).slice(-2);
        var hours = ('0' + currentTime.getHours()).slice(-2);
        var minutes = ('0' + currentTime.getMinutes()).slice(-2);
        var seconds = ('0' + currentTime.getSeconds()).slice(-2);
        var formattedTime = year + month + day + '_' + hours + minutes + seconds;
        return formattedTime;

      }

      window.addEventListener('DOMContentLoaded', init);
    </script>

    <div id="sample">
      <div id="myDiagramDiv" class="background-div"></div>


      <div style="display: flex; justify-content: space-between; align-items: center;">
        <h3 class="gradient-text">Lược đồ một số sản phẩm tiêu biểu của Viettel Software</h2>
          <div>
            <p>
              <button style="width: 210px;" id="zoomToFit">Căn vừa màn hình</button>
              <button style="width: 210px;" id="centerRoot">Căn giữa theo công ty</button>
              <button style="width: 210px;" id="exportToSVG">Xuất ảnh SVG</button>
              <button style="width: 210px;"><a href="catalogue.html" target="_blank" style="color: white;">Xem Catalogue đầy đủ</a></button>
            </p>
          </div>
      </div>


      <div>
        <textarea id="mySavedModel" style="display: none;">
