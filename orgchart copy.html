<!DOCTYPE html>
<html lang="vi">
<head>

  <script src="https://cdn.jsdelivr.net/npm/gojs@2.3.10/release/go.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gojs@2.3.10/extensions/DataInspector.js"></script>

  <style>
    body { font-family: 'Open Sans', sans-serif; margin: 0; padding: 0; }
    h3 { text-align: center; color: #19658F; margin: 15px 0; }
    .background-div {
      height: 80vh;
      background: linear-gradient(to top, #fad8c3, #fceadf);
      border: solid 3px #19658F;
      position: relative;
    }
    #myDiagramDiv { width: 100%; height: 100%; }
    button {
      background: #015380; color: white; border: none; padding: 10px 18px;
      cursor: pointer; border-radius: 4px; font-size: 14px;
    }
    button:hover { background: #ff6302; }
    #controls { text-align: center; margin: 15px 0; display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; }
    #logo-corner {
      position: absolute; top: 20px; left: 20px; z-index: 9999;
      width: 220px; height: 80px; background: #f0f0f0; border: 1px solid #19658F;
      display: flex; align-items: center; justify-content: center;
    }
    @media (max-width: 768px) {
      .background-div { height: 70vh; }
      #controls { flex-direction: column; align-items: center; }
      button { width: 90%; max-width: 280px; }
    }
  </style>
</head>
<body>

  <div id="logo-corner">
    <img src="/assets/logos/Logo-bgWhiteFull.png" alt="CLB DNQTMN Logo" style="max-width:95%; max-height:95%;">
  </div>

  <div id="allSampleContent" style="padding: 10px;">
    <div id="sample">
      <div id="myDiagramDiv" class="background-div"></div>

      <div id="controls">
        <button id="zoomToFit">Căn vừa màn hình</button>
        <button id="centerRoot">Căn giữa theo sếp</button>
        <button id="exportToSVG">Xuất ảnh SVG</button>
        <button id="exportPngFromUrl">Xuất ảnh PNG</button>
      </div>

      <h3>SƠ ĐỒ TỔ CHỨC CLB DOANH NHÂN QUẢNG TRỊ</h3>
      <p style="text-align:center; color:#19658F; margin-top:10px;">
        <a href="https://lazinet.com/lazinet-support-pricing">
          <span style="color:#ff6302;"><b>LAZI</b></span><span style="color:#0000ff;"><b>NET</b></span> OrgChart V3.1
        </a>
      </p>
    </div>

    <!-- Hidden textarea for model (giữ để debug nếu cần) -->
    <textarea id="mySavedModel" style="display:none; width:100%; height:200px;"></textarea>
  </div>

  <script>
    let myDiagram;

    function init() {
      const $ = go.GraphObject.make;

      myDiagram = new go.Diagram("myDiagramDiv", {
        allowCopy: false,
        allowDelete: false,
        maxSelectionCount: 1,
        validCycle: go.Diagram.CycleDestinationTree,
        "clickCreatingTool.archetypeNodeData": {
          Full_Name: "Thành viên CLB",
          Professional_Title: "",
          Department_Team: "",
          Lead_Title: "",
          parent: "",
          Portrait_URL: "",
          Profile_URL: "",
          Remarks: ""
        },
        layout: $(go.TreeLayout, {
          treeStyle: go.TreeLayout.StyleLastParents,
          arrangement: go.TreeLayout.ArrangementHorizontal,
          angle: 90,
          layerSpacing: 35,
          alternateAngle: 90,
          alternateLayerSpacing: 35,
          alternateAlignment: go.TreeLayout.AlignmentBus,
          alternateNodeSpacing: 20
        }),
        "undoManager.isEnabled": true
      });

      // Modified listener
      myDiagram.addDiagramListener("Modified", e => {
        const idx = document.title.indexOf("*");
        if (myDiagram.isModified) {
          if (idx < 0) document.title += "*";
        } else if (idx >= 0) {
          document.title = document.title.slice(0, idx);
        }
      });

      const levelColors = ["#FF0000","#FFA500","#FFFF00","#00FF00","#0000FF","#FFC0CB","#FFFFFF","#808080"];

      myDiagram.layout.commitNodes = function() {
        go.TreeLayout.prototype.commitNodes.call(this);
        myDiagram.layout.network.vertexes.each(v => {
          if (v.node) {
            const level = v.level % levelColors.length;
            const color = levelColors[level];
            const shape = v.node.findObject("SHAPE");
            if (shape) {
              shape.stroke = $(go.Brush, "Linear", { 0: color, 1: go.Brush.lightenBy(color, 0.05), start: go.Spot.Left, end: go.Spot.Right });
            }
          }
        });
      };

      function textStyle() { return { font: "9pt Segoe UI,sans-serif", stroke: "white" }; }

      function findHeadShot(url) { return url || "https://cdn-icons-png.flaticon.com/128/4122/4122823.png"; }

      myDiagram.nodeTemplate =
        $(go.Node, "Spot",
          {
            selectionObjectName: "BODY",
            mouseEnter: (e, node) => {
              node.findObject("BUTTON").opacity = 1;
              node.findObject("BUTTONX").opacity = 1;
            },
            mouseLeave: (e, node) => {
              node.findObject("BUTTON").opacity = 0;
              node.findObject("BUTTONX").opacity = 0;
            }
          },
          new go.Binding("text", "Full_Name"),
          new go.Binding("layerName", "isSelected", s => s ? "Foreground" : "").ofObject(),
          $(go.Panel, "Auto", { name: "BODY" },
            $(go.Shape, "Rectangle", { name: "SHAPE", fill: "#19658F", stroke: "white", strokeWidth: 3.5, portId: "" }),
            $(go.Panel, "Horizontal",
              $(go.Picture, {
                desiredSize: new go.Size(70, 70),
                margin: 1.5
              }, new go.Binding("source", "Portrait_URL", findHeadShot)),
              $(go.Panel, "Table", {
                minSize: new go.Size(130, NaN),
                maxSize: new go.Size(150, NaN),
                margin: new go.Margin(6, 10, 0, 6),
                defaultAlignment: go.Spot.Left
              },
                $(go.TextBlock, textStyle(), {
                  row: 0, column: 0, columnSpan: 5,
                  font: "bold 11pt Segoe UI,sans-serif",
                  editable: true,
                  isMultiline: false,
                  click: (e, tb) => {
                    const url = tb.part.data.Profile_URL;
                    if (url) window.open(url, "_blank");
                  }
                }, new go.Binding("text", "Full_Name").makeTwoWay()),
                $(go.TextBlock, textStyle(), {
                  row: 1, column: 0, columnSpan: 4,
                  editable: true,
                  isMultiline: false
                }, new go.Binding("text", "Professional_Title").makeTwoWay()),
                $(go.TextBlock, textStyle(), {
                  row: 2, column: 0, columnSpan: 5,
                  font: "italic 8pt Segoe UI,sans-serif",
                  wrap: go.TextBlock.WrapFit,
                  editable: true
                }, new go.Binding("text", d => d.Lead_Title || d.Department_Team))
              )
            )
          ),
          $("Button", $(go.Shape, "PlusLine", { width: 10, height: 10 }), {
            name: "BUTTON", alignment: go.Spot.Right, opacity: 0,
            click: (e, btn) => addEmployee(btn.part)
          }, new go.Binding("opacity", "isSelected", s => s ? 1 : 0).ofObject()),
          $("TreeExpanderButton", {
            name: "BUTTONX", alignment: go.Spot.Bottom, opacity: 0,
            "_treeExpandedFigure": "TriangleUp",
            "_treeCollapsedFigure": "TriangleDown"
          }, new go.Binding("opacity", "isSelected", s => s ? 1 : 0).ofObject())
        );

      function addEmployee(node) {
        if (!node) return;
        const data = node.data;
        myDiagram.startTransaction("add employee");
        const newData = {
          key: myDiagram.model.nextId(),
          Full_Name: "Thành viên mới",
          Professional_Title: "",
          Department_Team: "",
          Lead_Title: "",
          Portrait_URL: "",
          Profile_URL: "",
          Remarks: "",
          parent: data.key
        };
        myDiagram.model.addNodeData(newData);
        myDiagram.commitTransaction("add employee");
      }

      myDiagram.linkTemplate =
        $(go.Link, go.Link.Orthogonal, { layerName: "Background", corner: 5 },
          $(go.Shape, { strokeWidth: 2, stroke: "#19658F" }));

      // Load data từ Google Apps Script
      load();

      // Events
      document.getElementById('zoomToFit').addEventListener('click', () => myDiagram.commandHandler.zoomToFit());
      document.getElementById('centerRoot').addEventListener('click', () => {
        myDiagram.scale = 1;
        myDiagram.commandHandler.scrollToPart(myDiagram.findNodeForKey(1));
      });

      document.getElementById('exportToSVG').addEventListener('click', makeSvgWithEmbeddedImages);
      document.getElementById('exportPngFromUrl').addEventListener('click', exportToPngDynamic);

      myDiagram.addDiagramListener("InitialLayoutCompleted", e => {
        e.diagram.zoomToFit();
      });
    }

    // ────────────────────────────────────────────────
    // Load data từ Google Sheet
    // ────────────────────────────────────────────────
    function load() {
      const apiUrl = "https://script.google.com/macros/s/AKfycbzgGXYT8QxmhcQ7zUGI-JiN25REfV9xPeuWUmPnRTchYLa8chGue6MJAJ9DIuonEZKwAg/exec";

      fetch(apiUrl)
        .then(r => { if (!r.ok) throw new Error("Lỗi tải dữ liệu"); return r.json(); })
        .then(data => {
          myDiagram.model = go.Model.fromJson(data);

          const div = document.getElementById("myDiagramDiv");
          if (data.config?.backgroundUrl) {
            div.style.backgroundImage = `url(${data.config.backgroundUrl})`;
            div.style.backgroundSize = "cover";
            div.style.backgroundPosition = "center";
          } else if (data.config?.backgroundColor) {
            div.style.backgroundColor = data.config.backgroundColor;
          }
        })
        .catch(err => {
          console.error(err);
          alert("Không tải được dữ liệu: " + err.message);
        });
    }

    // ────────────────────────────────────────────────
    // Xuất SVG (đã nhúng base64)
    // ────────────────────────────────────────────────
    async function makeSvgWithEmbeddedImages() {
      const imageUrls = myDiagram.model.nodeDataArray
        .filter(n => n.Portrait_URL && !n.Portrait_URL.startsWith('data:'))
        .map(n => n.Portrait_URL);

      const base64Map = {};
      for (const url of imageUrls) {
        try {
          base64Map[url] = await fetchImageAsBase64(url);
        } catch {}
      }

      const svg = myDiagram.makeSvg({ scale: 1.5, background: "transparent" });
      let svgStr = new XMLSerializer().serializeToString(svg);

      for (const [url, b64] of Object.entries(base64Map)) {
        svgStr = svgStr.replace(new RegExp(url.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'g'), b64);
      }

      const blob = new Blob([svgStr], { type: "image/svg+xml" });
      downloadBlob(blob, `CLB_DNQTMN_OrgChart_${timeNow()}.svg`);
    }

    // ────────────────────────────────────────────────
    // Xuất PNG động (SVG → PNG ngay trên trình duyệt)
    // ────────────────────────────────────────────────
    async function exportToPngDynamic() {
      try {
        // 1. Thu thập & chuyển ảnh thành base64
        const imageUrls = myDiagram.model.nodeDataArray
          .filter(n => n.Portrait_URL && !n.Portrait_URL.startsWith('data:'))
          .map(n => n.Portrait_URL);

        const base64Map = {};
        for (const url of imageUrls) {
          try {
            base64Map[url] = await fetchImageAsBase64(url);
          } catch {}
        }

        // 2. Tạo SVG + nhúng base64
        const svg = myDiagram.makeSvg({ scale: 2, background: "transparent" });
        let svgStr = new XMLSerializer().serializeToString(svg);

        for (const [url, b64] of Object.entries(base64Map)) {
          svgStr = svgStr.replace(new RegExp(url.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'g'), b64);
        }

        // 3. SVG → PNG Blob
        const pngBlob = await svgToPngBlob(svgStr);

        // 4. Tải về
        downloadBlob(pngBlob, `CLB_DNQTMN_OrgChart_${timeNow()}.png`);
        alert("Đã xuất file PNG thành công!");
      } catch (err) {
        console.error(err);
        alert("Xuất PNG thất bại: " + err.message);
      }
    }

    async function svgToPngBlob(svgString) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        const blob = new Blob([svgString], { type: 'image/svg+xml;charset=utf-8' });
        const url = URL.createObjectURL(blob);

        img.onload = () => {
          const canvas = document.createElement('canvas');
          canvas.width = img.naturalWidth;
          canvas.height = img.naturalHeight;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0);
          canvas.toBlob(b => {
            URL.revokeObjectURL(url);
            b ? resolve(b) : reject(new Error("Không tạo được PNG"));
          }, 'image/png', 1);
        };

        img.onerror = () => {
          URL.revokeObjectURL(url);
          reject(new Error("Không load được SVG"));
        };

        img.src = url;
      });
    }

    async function fetchImageAsBase64(url) {
      const r = await fetch(url);
      if (!r.ok) throw new Error("Tải ảnh thất bại");
      const blob = await r.blob();
      return new Promise((res, rej) => {
        const reader = new FileReader();
        reader.onload = () => res(reader.result);
        reader.onerror = rej;
        reader.readAsDataURL(blob);
      });
    }

    function downloadBlob(blob, filename) {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      setTimeout(() => {
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      }, 100);
    }

    function timeNow() {
      const d = new Date();
      return d.getFullYear() +
        ('0' + (d.getMonth()+1)).slice(-2) +
        ('0' + d.getDate()).slice(-2) + '_' +
        ('0' + d.getHours()).slice(-2) +
        ('0' + d.getMinutes()).slice(-2) +
        ('0' + d.getSeconds()).slice(-2);
    }

    window.addEventListener('DOMContentLoaded', init);
  </script>
</body>
