<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Team Members</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- AOS CSS -->
  <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    .team.section {
      padding: 60px 0;
      background-color: #f8f9fa;
    }
    .section-title h2 {
      font-size: 2.5rem;
      font-weight: bold;
      text-align: center;
      margin-bottom: 20px;
    }
    .team-member {
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      overflow: hidden;
      transition: transform 0.3s ease;
    }
    .team-member:hover {
      transform: translateY(-10px);
    }
    .member-img {
      position: relative;
      overflow: hidden;
    }
    .member-img img {
      width: 100%;
      height: 300px;
      object-fit: cover;
      object-position: top;
      border-radius: 10px 10px 0 0;
    }
    .member-img .tooltip {
      visibility: hidden;
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.8);
      color: #fff;
      padding: 10px;
      border-radius: 5px;
      width: 90%;
      font-size: 0.9rem;
      z-index: 10;
      opacity: 0;
      transition: opacity 0.3s ease;
    }
    .member-img:hover .tooltip {
      visibility: visible;
      opacity: 1;
    }
    .member-info {
      padding: 20px;
      text-align: center;
    }
    .member-info h4 {
      font-size: 1.5rem;
      margin-bottom: 5px;
      color: #333;
    }
    .member-info span {
      color: #777;
      font-size: 1rem;
    }
    .social a {
      margin: 0 10px;
      font-size: 1.5rem;
      color: #007bff;
      transition: color 0.3s ease;
    }
    .social a:hover {
      color: #0056b3;
    }
  </style>
</head>
<body>
  <section id="team" class="team section">
    <div class="container section-title" data-aos="fade-up">
      <h2>DOANH NHÂN TIÊU BIỂU CỦA CLB DNQT MIỀN NAM</h2>
    </div>
    <div class="container" data-aos="fade-up" data-aos-delay="100">
      <h3 class="text-center"><u id="group-title">Ban Điều Hành CLB</u></h3>
      <br>
      <div class="row gy-5" id="team-list">
        <!-- Team members will be dynamically inserted here -->
      </div>
    </div>
  </section>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <!-- AOS JS -->
  <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
  <script>
    // Initialize AOS
    AOS.init();

    // Function to fetch and render team members
    async function fetchTeamMembers() {
      try {
        // Get Group Code from URL parameter or default to 1
        const urlParams = new URLSearchParams(window.location.search);
        const groupCode = urlParams.get('GroupCode') || '1';

        // Update group title based on Group Code
        const groupTitle = document.getElementById('group-title');
        groupTitle.textContent = groupCode === '1' ? 'Ban Điều Hành CLB' : `Nhóm ${groupCode}`;

        // Replace with your Apps Script Web App URL
        const response = await fetch(`https://script.google.com/macros/s/AKfycbxMsibqRgGyjcVFC_t8EuAikgp7k88fUN6w0TGzadRjUaaaGuQwnjYsCIXRbHfXWe8/exec?GroupCode=${groupCode}`);
        const members = await response.json();

        const teamList = document.getElementById('team-list');
        teamList.innerHTML = ''; // Clear existing content

        members.forEach(member => {
          const col = document.createElement('div');
          col.className = 'col-xl-3 col-md-6 d-flex';
          col.setAttribute('data-aos', 'zoom-in');
          col.setAttribute('data-aos-delay', '200');
          col.innerHTML = `
            <div class="team-member">
              <div class="member-img">
                <img src="${member.image}" class="img-fluid" alt="${member.name}">
                ${member.description ? `<span class="tooltip">${member.description}</span>` : ''}
              </div>
              <div class="member-info">
                <div class="social">
                  ${member.businessCard ? `<a href="${member.businessCard}" target="_blank"><i class="bi bi-card-text"></i></a>` : ''}
                  ${member.facebook ? `<a href="${member.facebook}" target="_blank"><i class="bi bi-facebook"></i></a>` : ''}
                  ${member.zalo ? `<a href="${member.zalo}" target="_blank"><i class="bi bi-chat-dots"></i></a>` : ''}
                </div>
                <h4>${member.name}</h4>
                <span>${member.additional1 || 'Thành viên'}</span>
              </div>
            </div>
          `;
          teamList.appendChild(col);
        });
      } catch (error) {
        console.error('Error fetching team members:', error);
      }
    }

    // Fetch team members when the page loads
    window.onload = fetchTeamMembers;
  </script>
</body>
</html>
