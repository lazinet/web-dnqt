<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chứng Nhận Thành Viên - CLB Doanh Nhân Quảng Trị Miền Nam</title>
    <link href="https://fonts.googleapis.com/css2?family=Cambria:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/gh/davidshimjs/qrcodejs/qrcode.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        :root {
            --primary-color: #19658F;
            --secondary-color: #F15E22;
            --light-color: #f8f9fa;
            --dark-color: #333;
            --border-color: #ddd;
            --success-color: #28a745;
            --error-color: #dc3545;
            --warning-color: #ffc107;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Cambria', serif;
            background-color: #f5f5f5;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            overflow-x: hidden;
        }
        
        /* Container chính */
        .certificate-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 100%;
        }
        
        /* Certificate */
        .certificate {
            width: 100%;
            height: calc(100vw / 1.414); /* Tỉ lệ A4 landscape */
            max-width: 100%;
            max-height: 100vh;
            background-image: url('/members/members/blank.png');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            position: relative;
            margin-bottom: 20px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }
        
        /* Nội dung trên certificate */
        .certificate-content {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        
        .member-name {
            font-size: 3.5vw;
            font-weight: bold;
            color: var(--secondary-color);
            text-align: center;
            margin-top: 25%; /* 40% top adjust */
            font-family: 'Cambria', serif;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
        }
        
        .signature-date {
            position: absolute;
            bottom: 15%;
            right: 15%;
            font-size: 1.2vw;
            color: var(--primary-color);
            font-family: 'Cambria', serif;
        }
        
        .qr-code-container {
            position: absolute;
            top: 8%;
            right: 8%;
            width: 12%;
        }
        
        .qr-code {
            width: 100%;
            height: auto;
            background: white;
            border: 2px solid var(--primary-color);
            border-radius: 5px;
            padding: 2mm;
            box-sizing: border-box;
        }
        
        /* Các nút chức năng */
        .action-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin-top: 20px;
            width: 100%;
            max-width: 800px;
        }
        
        .action-buttons button {
            padding: 10px 20px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-family: 'Cambria', serif;
            font-size: 16px;
            transition: background-color 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .action-buttons button:hover {
            background-color: var(--secondary-color);
        }
        
        /* Các phần mở rộng */
        .expandable-section {
            width: 100%;
            max-width: 800px;
            margin-top: 20px;
            background-color: white;
            border-radius: 5px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            display: none;
        }
        
        .expandable-section.active {
            display: block;
        }
        
        .section-header {
            background-color: var(--primary-color);
            color: white;
            padding: 15px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .section-content {
            padding: 20px;
        }
        
        /* Thông tin thành viên */
        .member-info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 15px;
        }
        
        .info-item {
            margin-bottom: 10px;
        }
        
        .info-label {
            font-weight: bold;
            color: var(--primary-color);
            margin-bottom: 5px;
        }
        
        .info-value {
            color: var(--dark-color);
        }
        
        /* Form liên hệ */
        .contact-form {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        
        .form-group {
            margin-bottom: 15px;
        }
        
        .form-group.full-width {
            grid-column: 1 / -1;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: var(--primary-color);
        }
        
        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 5px;
            font-family: 'Cambria', serif;
            font-size: 16px;
        }
        
        .form-group textarea {
            resize: vertical;
            min-height: 120px;
        }
        
        .submit-btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-family: 'Cambria', serif;
            font-size: 16px;
            transition: background-color 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            grid-column: 1 / -1;
        }
        
        .submit-btn:hover {
            background-color: var(--secondary-color);
        }
        
        .spinner {
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
            display: none;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .message-box {
            padding: 10px;
            border-radius: 5px;
            margin-top: 15px;
            text-align: center;
            display: none;
        }
        
        .message-box.success {
            background-color: rgba(40, 167, 69, 0.1);
            color: var(--success-color);
            border: 1px solid var(--success-color);
        }
        
        .message-box.error {
            background-color: rgba(220, 53, 69, 0.1);
            color: var(--error-color);
            border: 1px solid var(--error-color);
        }
        
        /* Responsive */
        @media (max-width: 768px) {
            .certificate {
                height: calc(100vw / 1.414);
            }
            
            .member-name {
                font-size: 5vw;
                margin-top: 30%;
            }
            
            .signature-date {
                font-size: 2vw;
            }
            
            .contact-form {
                grid-template-columns: 1fr;
            }
            
            .action-buttons {
                flex-direction: column;
            }
            
            .action-buttons button {
                width: 100%;
            }
        }
        
        @media (max-width: 480px) {
            .member-name {
                font-size: 7vw;
                margin-top: 35%;
            }
            
            .signature-date {
                font-size: 3vw;
            }
            
            .member-info-grid {
                grid-template-columns: 1fr;
            }
        }
        
        /* Xoay màn hình cho mobile */
        @media (max-height: 500px) and (orientation: portrait) {
            body {
                transform: rotate(90deg);
                transform-origin: left top;
                width: 100vh;
                height: 100vw;
                overflow-x: hidden;
                position: absolute;
                top: 100%;
                left: 0;
            }
        }

        .loading {
            display: none;
            text-align: center;
            padding: 20px;
            color: var(--primary-color);
        }

        .loading.active {
            display: block;
        }
    </style>
</head>
<body>
    <div class="certificate-container">
        <!-- Loading indicator -->
        <div class="loading" id="loading">
            <i class="bi bi-arrow-repeat" style="font-size: 24px; animation: spin 1s linear infinite;"></i>
            <p>Đang tải dữ liệu...</p>
        </div>

        <!-- Certificate -->
        <div class="certificate" id="certificate">
            <div class="certificate-content">
                <div class="qr-code-container">
                    <div class="qr-code" id="qrcode"></div>
                </div>
                <div class="member-name" id="memberName">ĐANG TẢI...</div>
                <div class="signature-date" id="signatureDate">TP.HCM, --/--/----</div>
            </div>
        </div>
        
        <!-- Các nút chức năng -->
        <div class="action-buttons">
            <button id="infoBtn">
                <i class="bi bi-info-circle"></i> Thông tin
            </button>
            <button id="contactBtn">
                <i class="bi bi-chat-left-text"></i> Nhắn tin
            </button>
            <button id="exportImageBtn">
                <i class="bi bi-image"></i> Xuất ảnh
            </button>
            <button id="exportPdfBtn">
                <i class="bi bi-file-pdf"></i> Xuất PDF
            </button>
            <button id="shareBtn">
                <i class="bi bi-share"></i> Chia sẻ
            </button>
        </div>
        
        <!-- Thông tin thành viên -->
        <div class="expandable-section" id="infoSection">
            <div class="section-header" id="infoHeader">
                <span>Thông tin thành viên</span>
                <i class="bi bi-chevron-down"></i>
            </div>
            <div class="section-content">
                <div class="member-info-grid" id="memberInfo">
                    <div class="info-item">
                        <div class="info-label">Đang tải thông tin...</div>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Form liên hệ -->
        <div class="expandable-section" id="contactSection">
            <div class="section-header" id="contactHeader">
                <span>Gửi tin nhắn</span>
                <i class="bi bi-chevron-down"></i>
            </div>
            <div class="section-content">
                <form id="contactForm" class="contact-form">
                    <div class="form-group">
                        <label for="senderName">Họ và tên:</label>
                        <input type="text" id="senderName" name="senderName" required>
                    </div>
                    <div class="form-group">
                        <label for="senderPosition">Chức vụ:</label>
                        <input type="text" id="senderPosition" name="senderPosition" required>
                    </div>
                    <div class="form-group">
                        <label for="senderPhone">Số điện thoại:</label>
                        <input type="tel" id="senderPhone" name="senderPhone" required>
                    </div>
                    <div class="form-group">
                        <label for="senderEmail">Email:</label>
                        <input type="email" id="senderEmail" name="senderEmail" required>
                    </div>
                    <div class="form-group">
                        <label for="senderCompany">Tên công ty:</label>
                        <input type="text" id="senderCompany" name="senderCompany" required>
                    </div>
                    <div class="form-group">
                        <label for="purpose">Mục đích liên hệ:</label>
                        <select id="purpose" name="purpose" required>
                            <option value="">Chọn mục đích</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="subject">Tiêu đề:</label>
                        <input type="text" id="subject" name="subject" required>
                    </div>
                    <div class="form-group full-width">
                        <label for="message">Nội dung:</label>
                        <textarea id="message" name="message" placeholder="Nhập nội dung tin nhắn (tối đa 4 dòng)" required></textarea>
                    </div>
                    <button type="submit" class="submit-btn">
                        <span class="button-text">Gửi tin</span>
                        <span class="spinner"></span>
                    </button>
                </form>
                <div id="messageBox" class="message-box"></div>
            </div>
        </div>
    </div>

    <script>
        let memberData = {};
        let contactPurposes = [];
        const CONFIG = {
            scriptUrl: 'https://script.google.com/macros/s/AKfycbyDNGLSGIQ20WTC_5R-t_ESl5ZquatAluKw-NPMTuCGqODpV_m5e_zRy1yt65CdDG9yoA/exec' // Your GAS URL
        };

        // Load dữ liệu thành viên khi trang load
        async function loadMemberData() {
            const urlParams = new URLSearchParams(window.location.search);
            const memberId = urlParams.get('om');
            
            if (!memberId) {
                document.getElementById('memberName').textContent = 'Mã doanh nhân không hợp lệ';
                document.getElementById('signatureDate').textContent = 'TP.HCM, --/--/----';
                return;
            }
            
            const loading = document.getElementById('loading');
            loading.classList.add('active');
            
            try {
                // Fetch với params string (simple, no preflight)
                const params = new URLSearchParams({
                    action: 'getMember',
                    memberId: memberId
                });
                const response = await fetch(`${CONFIG.scriptUrl}?${params.toString()}`);
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const data = await response.json();
                
                if (data.status === 'success' && data.member) {
                    memberData = data.member;
                    contactPurposes = data.configs || [];
                    
                    // Render
                    renderMemberData();
                    populateContactPurposes();
                    generateQRCode();
                    
                    console.log('Data loaded:', memberData);
                } else {
                    throw new Error(data.message || 'Không tìm thấy dữ liệu thành viên');
                }
            } catch (error) {
                console.error('Lỗi tải dữ liệu:', error);
                document.getElementById('memberName').textContent = 'Lỗi tải dữ liệu';
                document.getElementById('signatureDate').textContent = 'TP.HCM, --/--/----';
                alert('Có lỗi xảy ra khi tải dữ liệu. Vui lòng thử lại.');
            } finally {
                loading.classList.remove('active');
            }
        }
        
        // Render dữ liệu thành viên lên certificate
        function renderMemberData() {
            document.getElementById('memberName').textContent = memberData.name || 'N/A';
            document.getElementById('signatureDate').textContent = memberData.joinDate || 'TP.HCM, --/--/----';
            
            // Render thông tin chi tiết
            const memberInfo = document.getElementById('memberInfo');
            memberInfo.innerHTML = `
                <div class="info-item">
                    <div class="info-label">Mã doanh nhân</div>
                    <div class="info-value">${memberData.memberId}</div>
                </div>
                <div class="info-item">
                    <div class="info-label">Tên doanh nhân</div>
                    <div class="info-value">${memberData.name}</div>
                </div>
                <div class="info-item">
                    <div class="info-label">Chức vụ</div>
                    <div class="info-value">${memberData.position}</div>
                </div>
                <div class="info-item">
                    <div class="info-label">Tên công ty</div>
                    <div class="info-value">${memberData.company}</div>
                </div>
                <div class="info-item">
                    <div class="info-label">Địa chỉ công ty</div>
                    <div class="info-value">${memberData.address}</div>
                </div>
                <div class="info-item">
                    <div class="info-label">Lĩnh vực kinh doanh</div>
                    <div class="info-value">${memberData.businessField}</div>
                </div>
                <div class="info-item">
                    <div class="info-label">Sản phẩm/dịch vụ cần bán</div>
                    <div class="info-value">${memberData.productsToSell}</div>
                </div>
                <div class="info-item">
                    <div class="info-label">Sản phẩm/dịch vụ cần mua</div>
                    <div class="info-value">${memberData.productsToBuy}</div>
                </div>
                <div class="info-item">
                    <div class="info-label">Quá trình tham gia</div>
                    <div class="info-value">${memberData.participationHistory}</div>
                </div>
                <div class="info-item">
                    <div class="info-label">Thành tích giao thương</div>
                    <div class="info-value">${memberData.tradingAchievements}</div>
                </div>
                <div class="info-item">
                    <div class="info-label">Sao đánh giá thành viên</div>
                    <div class="info-value">${memberData.rating ? '★'.repeat(parseInt(memberData.rating)) : 'N/A'}</div>
                </div>
                <div class="info-item">
                    <div class="info-label">Cập nhật mới nhất</div>
                    <div class="info-value">${memberData.latestUpdate}</div>
                </div>
                <div class="info-item">
                    <div class="info-label">Ngày thành viên</div>
                    <div class="info-value">${memberData.joinDate}</div>
                </div>
            `;
        }
        
        // Định dạng ngày
        function formatDate(dateString) {
            if (!dateString || dateString === '--/--/----') return dateString;
            try {
                const date = new Date(dateString);
                if (isNaN(date.getTime())) return dateString;
                return date.toLocaleDateString('vi-VN');
            } catch (error) {
                return dateString;
            }
        }
        
        // Tạo QR code
        function generateQRCode() {
            const url = `https://dnqt.vn/members/2025.html?om=${memberData.memberId}`;
            document.getElementById("qrcode").innerHTML = "";
            new QRCode(document.getElementById("qrcode"), {
                text: url,
                width: 128,
                height: 128,
                colorDark: "#19658F",
                colorLight: "#ffffff",
                correctLevel: QRCode.CorrectLevel.H
            });
        }
        
        // Điền mục đích liên hệ
        function populateContactPurposes() {
            const purposeSelect = document.getElementById('purpose');
            purposeSelect.innerHTML = '<option value="">Chọn mục đích</option>';
            contactPurposes.forEach(purpose => {
                const option = document.createElement('option');
                option.value = purpose;
                option.textContent = purpose;
                purposeSelect.appendChild(option);
            });
        }
        
        // Thiết lập sự kiện
        function setupEventListeners() {
            document.getElementById('infoBtn').addEventListener('click', () => toggleSection('infoSection'));
            document.getElementById('infoHeader').addEventListener('click', () => toggleSection('infoSection'));
            document.getElementById('contactBtn').addEventListener('click', () => toggleSection('contactSection'));
            document.getElementById('contactHeader').addEventListener('click', () => toggleSection('contactSection'));
            document.getElementById('exportImageBtn').addEventListener('click', exportToPNG);
            document.getElementById('exportPdfBtn').addEventListener('click', exportToPDF);
            document.getElementById('shareBtn').addEventListener('click', shareCertificate);
            document.getElementById('contactForm').addEventListener('submit', submitContactForm);
        }
        
        // Toggle section
        function toggleSection(sectionId) {
            const section = document.getElementById(sectionId);
            const isActive = section.classList.contains('active');
            document.querySelectorAll('.expandable-section').forEach(s => s.classList.remove('active'));
            if (!isActive) section.classList.add('active');
        }
        
        // Xuất ảnh
        function exportToPNG() {
            const certificate = document.getElementById('certificate');
            const originalBoxShadow = certificate.style.boxShadow;
            certificate.style.boxShadow = 'none';
            html2canvas(certificate, {
                scale: 3,
                useCORS: true,
                allowTaint: false,
                backgroundColor: null,
                logging: false
            }).then(canvas => {
                const link = document.createElement('a');
                link.download = `ChungNhan_${memberData.memberId}.png`;
                link.href = canvas.toDataURL('image/png', 1.0);
                link.click();
                certificate.style.boxShadow = originalBoxShadow;
            }).catch(error => {
                console.error('Lỗi xuất ảnh:', error);
                certificate.style.boxShadow = originalBoxShadow;
                alert('Có lỗi xảy ra khi xuất ảnh. Vui lòng thử lại.');
            });
        }
        
        // Xuất PDF
        function exportToPDF() {
            const { jsPDF } = window.jspdf;
            const certificate = document.getElementById('certificate');
            const originalBoxShadow = certificate.style.boxShadow;
            certificate.style.boxShadow = 'none';
            html2canvas(certificate, {
                scale: 3,
                useCORS: true,
                allowTaint: false,
                backgroundColor: null,
                logging: false
            }).then(canvas => {
                const imgData = canvas.toDataURL('image/png');
                const pdf = new jsPDF({
                    orientation: 'landscape',
                    unit: 'mm',
                    format: 'a4'
                });
                const imgWidth = 297;
                const imgHeight = (canvas.height * imgWidth) / canvas.width;
                pdf.addImage(imgData, 'PNG', 0, 0, imgWidth, imgHeight);
                pdf.save(`ChungNhan_${memberData.memberId}.pdf`);
                certificate.style.boxShadow = originalBoxShadow;
            }).catch(error => {
                console.error('Lỗi xuất PDF:', error);
                certificate.style.boxShadow = originalBoxShadow;
                alert('Có lỗi xảy ra khi xuất PDF. Vui lòng thử lại.');
            });
        }
        
        // Chia sẻ
        function shareCertificate() {
            if (navigator.share) {
                navigator.share({
                    title: `Chứng nhận thành viên - ${memberData.name}`,
                    text: `Chứng nhận thành viên CLB Doanh Nhân Quảng Trị Miền Nam của ${memberData.name}`,
                    url: window.location.href
                }).catch(err => {
                    console.error('Lỗi chia sẻ:', err);
                    alert('Không thể chia sẻ. Vui lòng thử lại.');
                });
            } else {
                navigator.clipboard.writeText(window.location.href)
                    .then(() => alert('Đã sao chép liên kết chứng nhận vào clipboard!'))
                    .catch(() => alert('Không thể sao chép liên kết. Vui lòng sao chép thủ công.'));
            }
        }
        
        // Gửi form liên hệ
        async function submitContactForm(e) {
            e.preventDefault();
            
            const submitBtn = document.querySelector('#contactForm .submit-btn');
            const buttonText = submitBtn.querySelector('.button-text');
            const spinner = submitBtn.querySelector('.spinner');
            const messageBox = document.getElementById('messageBox');
            
            buttonText.textContent = 'Đang gửi...';
            spinner.style.display = 'inline-block';
            submitBtn.disabled = true;
            messageBox.style.display = 'none';
            
            const formData = new FormData(e.target);
            const contactData = {
                action: 'submitContact',
                senderName: formData.get('senderName'),
                senderPosition: formData.get('senderPosition'),
                senderPhone: formData.get('senderPhone'),
                senderEmail: formData.get('senderEmail'),
                senderCompany: formData.get('senderCompany'),
                purpose: formData.get('purpose'),
                subject: formData.get('subject'),
                message: formData.get('message'),
                memberId: memberData.memberId,
                memberName: memberData.name,
                memberEmail: memberData.email
            };
            
            try {
                const params = new URLSearchParams(contactData);
                const response = await fetch(`${CONFIG.scriptUrl}?${params.toString()}`);
                
                if (response.ok) {
                    const data = await response.json();
                    
                    if (data.status === 'success') {
                        messageBox.textContent = data.message || 'Tin nhắn đã được gửi thành công!';
                        messageBox.className = 'message-box success';
                        messageBox.style.display = 'block';
                        e.target.reset();
                    } else {
                        throw new Error(data.message || 'Có lỗi xảy ra khi gửi tin nhắn');
                    }
                } else {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
            } catch (error) {
                console.error('Error:', error);
                messageBox.textContent = 'Có lỗi xảy ra khi gửi tin nhắn. Vui lòng thử lại.';
                messageBox.className = 'message-box error';
                messageBox.style.display = 'block';
            } finally {
                buttonText.textContent = 'Gửi tin';
                spinner.style.display = 'none';
                submitBtn.disabled = false;
            }
        }
        
        // Xử lý responsive
        function handleResponsive() {
            function adjustCertificateSize() {
                const certificate = document.getElementById('certificate');
                const screenWidth = window.innerWidth;
                const screenHeight = window.innerHeight;
                const sqrt2 = Math.sqrt(2);
                
                if (screenWidth > sqrt2 * screenHeight) {
                    certificate.style.height = `${screenHeight}px`;
                    certificate.style.width = `${sqrt2 * screenHeight}px`;
                } else {
                    certificate.style.width = `${screenWidth}px`;
                    certificate.style.height = `${screenWidth / sqrt2}px`;
                }
            }
            
            adjustCertificateSize();
            window.addEventListener('resize', adjustCertificateSize);
            window.addEventListener('orientationchange', () => setTimeout(adjustCertificateSize, 100));
        }
        
        // Khởi tạo
        document.addEventListener('DOMContentLoaded', function() {
            loadMemberData();
            setupEventListeners();
            handleResponsive();
        });
    </script>
</body>
</html>
